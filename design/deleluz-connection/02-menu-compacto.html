<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeleLuz · Menú compacto</title><style>
:root{--bg:#0a0918;--ink:#f5f3ff;--muted:#bdb6dc;--faint:#8f88b3;--glass:rgba(255,255,255,.065);--glass-2:rgba(255,255,255,.11);--line:rgba(255,255,255,.14);--grad:linear-gradient(135deg,#a855f7,#ec4899);--r-lg:24px;--r-md:16px;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.4 var(--font);background:radial-gradient(900px 500px at 10% 10%,#a855f747,transparent 60%),radial-gradient(800px 500px at 90% 80%,#ec489938,transparent 60%),var(--bg)}.board{width:min(100%,920px);margin:auto;padding:24px}.board h1{font-size:26px;margin:0}p{margin:0;color:var(--muted)}main{width:min(100%,920px);margin:auto;padding:0 24px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,412px));justify-content:space-between;gap:24px}figure{margin:0;min-width:0}figcaption{margin:0 0 10px 6px;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}.phone{height:915px;border-radius:44px;border:1px solid var(--line);overflow:hidden;position:relative;display:flex;flex-direction:column;background:radial-gradient(320px 220px at 15% 0%,#a855f74d,transparent 70%),radial-gradient(300px 260px at 100% 70%,#ec48992e,transparent 70%),linear-gradient(180deg,#141129,#0c0a1c);box-shadow:0 0 0 8px #050410,0 30px 80px #0008}.status{height:44px;flex:none;padding:0 26px;font-size:13px;font-weight:600}.row,.status{display:flex;align-items:center;justify-content:space-between;gap:8px}.screen{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:6px 18px 12px}.brand{display:flex;align-items:center;gap:8px;font-size:20px}.brand svg{width:30px;height:18px}.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(18px)}button,a{color:inherit;font:inherit}button{cursor:pointer;border:0;background:none}:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}.icon{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;background:var(--glass);border:1px solid var(--line);text-decoration:none;font-size:22px}.icon svg,nav svg{width:22px;height:22px}.device{display:grid;gap:4px}.device .row{font-size:14px}.chip{margin-left:auto;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 12px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80}.strip{height:14px;border-radius:999px;background:repeating-linear-gradient(90deg,transparent 0 6px,#0007 6px 8px),#ffd6a5;box-shadow:0 0 22px #ffc88c99}.power{display:grid;justify-items:center;gap:6px;text-align:center;padding:12px 0}.power button{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#ffffff1f,#ffffff08 60%),#1b1636;border:1px solid #fff3;box-shadow:0 0 0 6px #a855f72e,0 0 50px #ec489973,inset 0 0 30px #a855f759}.power svg{width:52px;height:52px}.power b{font-size:18px}.small,h3{font-size:13px;color:var(--muted)}h2,h3{margin:0}h3{text-transform:uppercase;letter-spacing:.08em}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.tile{border-radius:var(--r-md);padding:10px;background:var(--glass);border:1px solid var(--line);font-weight:600;text-align:left;min-height:60px}.sw,.track{display:block;border-radius:999px;height:8px;margin-bottom:6px;background:var(--grad)}.thumb{padding:14px 16px}.track{position:relative;margin:18px 0 10px;height:10px;background:linear-gradient(90deg,#a855f7,#ec4899) 0/80% 100% no-repeat,#ffffff1f}.track::after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:white;left:80%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 4px #a855f766}nav.tabs{height:78px;flex:none;padding:6px 10px 12px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(10,8,24,.82);border-top:1px solid var(--line);backdrop-filter:blur(16px)}nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);text-decoration:none;font-size:12px;font-weight:600;border-radius:14px}nav [aria-current]{color:var(--ink)}nav [aria-current] svg{stroke:#f0abfc;filter:drop-shadow(0 0 8px #ec4899)}.scrim{position:absolute;inset:165px 0 0;background:linear-gradient(180deg,rgba(5,4,14,.35),transparent)}.popup{position:absolute;top:154px;right:18px;width:min(240px,calc(100% - 36px));padding:8px;border-radius:var(--r-md);background:linear-gradient(180deg,#201840,#120e26);border:1px solid var(--line);box-shadow:0 20px 60px #0009}.popup h2{font-size:13px;color:var(--muted);padding:8px 12px;text-transform:uppercase;letter-spacing:.08em}.popup button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;text-align:left;padding:0 12px;border-radius:12px}.popup button+button{border-top:1px solid var(--line)}.popup svg{width:20px;height:20px;flex:none}.popup .danger{color:#fecaca}#abierta .device .icon{background:var(--glass-2);color:#f0abfc}@media(max-width:880px){main{grid-template-columns:minmax(0,412px);justify-content:center}.board{max-width:460px}}@media(max-width:360px){main{padding-inline:12px}.screen{padding-inline:12px}.chip{padding-inline:6px;gap:4px}.device .row{font-size:12px}}

/* Dos vistas de teléfono y un recorte del diálogo. */
.board,main{width:min(100%,1200px)}
main{grid-template-columns:repeat(2,minmax(0,412px)) minmax(240px,280px);justify-content:center}
@media(max-width:1080px){main{grid-template-columns:repeat(2,minmax(0,412px))}.board{max-width:920px}}
@media(max-width:780px){main{grid-template-columns:minmax(0,412px)}.board{max-width:460px}}
.identity{min-width:0}.identity b,.device .identity b{display:block;font-size:16px;line-height:20px;overflow-wrap:anywhere}
.real{display:block;color:var(--muted);font-size:12px;line-height:16px;overflow-wrap:anywhere}
.device .row{flex-wrap:nowrap}.device .chip{flex:none}.device .dot{flex:none}
.preview{border:1px solid var(--line);border-radius:24px;padding:10px;background:#100c23}
.rename-card{display:grid;gap:12px;padding:16px;border-radius:20px;background:linear-gradient(180deg,#251b45,#15102b);border:1px solid var(--line)}
.rename-card h2{font-size:20px}.rename-card label{display:grid;gap:6px;font-weight:700}
.rename-card input{width:100%;min-height:44px;padding:8px 10px;border:1px solid #8f88b3;border-radius:12px;background:#100c23;color:var(--ink);font:inherit}
.btn{display:inline-grid;place-items:center;min-height:44px;padding:6px 10px;border-radius:12px;background:var(--glass-2);border:1px solid var(--line);font-size:13px;font-weight:700;text-align:center}
.btn.primary{background:linear-gradient(135deg,#7e22ce,#be185d)}.btn.danger{color:#fecaca}
.strip-actions{display:flex;flex-wrap:wrap;gap:6px}.rename-card .strip-actions button{flex:1}
.group,.entries,.connection-content{display:grid;gap:8px;min-width:0}.entries{list-style:none;padding:0;margin:0}.connection-content{gap:14px}
.saved,.nearby{min-width:0;padding:10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--glass)}
.saved{display:grid;gap:6px}.saved.active{border-color:#b89af4;background:#a855f720}
.saved .row,.nearby{flex-wrap:wrap}.nearby b{overflow-wrap:anywhere}.state{color:var(--muted);font-size:12px}.active .state{color:#bbf7d0}
.scroll-area{overflow-y:auto;min-height:0;scrollbar-color:#b393e4 #251d41;scrollbar-width:thin;padding:4px;scroll-padding:4px}
.scroll-area:focus-visible{outline-offset:-2px}
.rename-live{width:min(calc(100% - 32px),360px);padding:0;border:0;border-radius:20px;color:var(--ink);background:transparent}.rename-live::backdrop{background:#05040ec9}
.popup{top:154px;right:18px;width:min(326px,calc(100% - 36px));padding:10px;display:grid;gap:8px}.popup h2{padding:0;color:var(--ink);font-size:19px;text-transform:none;letter-spacing:normal}.popup .btn{display:inline-grid;width:auto;min-height:44px;text-align:center;padding:6px 8px}.popup .strip-actions .btn{background:transparent}.popup .strip-actions .btn+.btn{border-top:1px solid var(--line)}.popup .saved{border-radius:12px;padding:8px}.popup .scroll-area{max-height:442px;overflow-y:scroll}.popup .scroll-note{text-align:center;font-size:12px}
</style></head><body>

<main><figure><figcaption>Inicio</figcaption><div class="phone" id="inicio"></div></figure><figure><figcaption>Menú ⋯ abierto</figcaption><div class="phone" id="abierta"></div></figure><figure><figcaption>Renombrar · detalle</figcaption><div class="preview">
<form class="rename-card" id="rename-preview" aria-labelledby="rename-title">
<h2 id="rename-title">Renombrar tira</h2><p class="real" data-device-name>LEDDMX-03-A1B2</p>
<label>Alias<input name="alias" type="text" value="Sala" maxlength="32" required></label>
<p class="small">El alias solo se guarda en este teléfono.</p>
<div class="strip-actions"><button class="btn" type="reset">Cancelar</button><button class="btn primary">Guardar</button></div>
</form></div></figure>
</main>
<template id="home-view"><div class="status" aria-hidden="true"><span>19:42</span><span>5G ▮▮▮</span></div><section class="screen" aria-label="Inicio"><header class="row"><b class="brand"><svg aria-hidden="true"><use href="#logo"/></svg>DeleLuz</b><button class="icon" aria-label="Temporizador"><svg data-icon="timer"></svg></button></header><section class="device" aria-label="Tira actual"><div class="row"><div class="identity"><b>Sala</b><span class="real">LEDDMX-03-A1B2</span></div><span class="chip"><span class="dot"></span>Conectado</span><a class="icon" href="#conexion" aria-label="Ver opciones de conexión">⋯</a></div><div class="strip" role="img" aria-label="Vista previa: blanco cálido"></div></section><div class="power"><button aria-label="Encendido" aria-pressed="true"><svg data-icon="power"></svg></button><b>Encendido · Blanco cálido</b><p class="small">Último comando enviado hace 2 s</p></div><section><div class="row"><h3>Escenas rápidas ›</h3><span class="small" style="color:#f0abfc">Todas las…</span></div><div class="tiles"><button class="tile"><span class="sw" style="background:#ffd6a5"></span>Cálido</button><button class="tile"><span class="sw" style="background:linear-gradient(90deg,#ef4444,#22c55e,#fff7e6)"></span>Navidad</button><button class="tile"><span class="sw" style="background:linear-gradient(90deg,#ef4444,#3b82f6)"></span>Policía</button><button class="tile"><span class="sw" style="background:linear-gradient(90deg,#22c55e,#facc15,#ef4444)"></span>Rasta</button><button class="tile"><span class="sw"></span>Cine</button><button class="tile"><span class="sw" style="background:#fff"></span>Destellos</button></div></section><section class="glass thumb"><div class="row"><b>Velocidad</b><span class="small">Solo para efectos</span></div><div class="track" style="opacity:.5" aria-hidden="true"></div><div class="row"><b>Brillo</b><b>80 %</b></div><div class="track" aria-hidden="true"></div></section></section><nav class="tabs" aria-label="Menú principal"><a href="#inicio" aria-current="page"><svg data-icon="home"></svg>Inicio</a><a href="#color"><svg data-icon="color"></svg>Color</a><a href="#escenas"><svg data-icon="scenes"></svg>Escenas</a><a href="#ajustes"><svg data-icon="settings"></svg>Ajustes</a></nav></template>
<template id="panel"><div class="scrim" aria-hidden="true"></div><section class="popup" id="conexion" tabindex="-1" aria-labelledby="titulo"><header class="row"><h2 id="titulo">Conexión</h2><a class="icon" href="#inicio" aria-label="Volver a Inicio">×</a></header>
<div class="scroll-area" tabindex="0" role="region" aria-label="Lista de tiras"><div class="connection-content">

<section class="group" aria-labelledby="mis-tiras"><h3 id="mis-tiras">Mis tiras · 4</h3><ul class="entries">
<li class="saved active">
<div class="row"><div class="identity"><b>Sala</b><span class="real">LEDDMX-03-A1B2</span></div><span class="state">Conectado</span></div>
<div class="strip-actions"><button class="btn " type="button" aria-label="Desconectar: Sala">Desconectar</button><button class="btn " type="button" aria-label="Renombrar: Sala" data-rename>Renombrar</button><button class="btn danger" type="button" aria-label="Olvidar: Sala">Olvidar</button></div>
</li>
<li class="saved">
<div class="row"><div class="identity"><b>Cuarto</b><span class="real">LEDDMX-03-03C1</span></div><span class="state">Recordada</span></div>
<div class="strip-actions"><button class="btn " type="button" aria-label="Conectar: Cuarto">Conectar</button><button class="btn " type="button" aria-label="Renombrar: Cuarto" data-rename>Renombrar</button><button class="btn danger" type="button" aria-label="Olvidar: Cuarto">Olvidar</button></div>
</li>

<div class="row"><div class="identity"><b>Escritorio</b><span class="real">LEDDMX-03-7F20</span></div><span class="state">Recordada</span></div>

</li>

<script>
const home=document.getElementById('home-view');for(const id of ['inicio','abierta'])document.getElementById(id).append(home.content.cloneNode(true));const opened=document.getElementById('abierta');for(const el of opened.children)el.inert=true;opened.append(document.getElementById('panel').content.cloneNode(true));for(const svg of document.querySelectorAll('[data-icon]')){svg.setAttribute('aria-hidden','true');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','2');svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#'+svg.dataset.icon);svg.append(use)}

// Demonstrates renaming in the mockup only; no Bluetooth or storage.
const preview=document.getElementById('rename-preview');
preview.addEventListener('submit',event=>event.preventDefault());
const dialog=document.createElement('dialog');
dialog.className='rename-live';
dialog.setAttribute('aria-labelledby','live-rename-title');
const form=preview.cloneNode(true);
form.removeAttribute('id');
form.querySelector('h2').id='live-rename-title';
form.setAttribute('aria-labelledby','live-rename-title');
dialog.append(form);
document.body.append(dialog);
let trigger;
for(const button of document.querySelectorAll('[data-rename]'))button.addEventListener('click',()=>{
  trigger=button;
  const row=button.closest('.saved');
  form.querySelector('[data-device-name]').textContent=row.querySelector('.real').textContent;
  form.elements.alias.value=row.querySelector('.identity b').textContent;
  dialog.showModal();
  form.elements.alias.select();
});
form.addEventListener('reset',()=>dialog.close());
form.addEventListener('submit',event=>{
  event.preventDefault();
  const alias=form.elements.alias.value.trim();
  if(!alias)return;
  const row=trigger.closest('.saved');
  row.querySelector('.identity b').textContent=alias;
  for(const button of row.querySelectorAll('button'))button.setAttribute('aria-label',`${button.textContent}: ${alias}`);
  if(row.classList.contains('active'))for(const name of document.querySelectorAll('.device .identity b'))name.textContent=alias;
  dialog.close();
});
dialog.addEventListener('close',()=>trigger?.focus());
</script></body></html>
