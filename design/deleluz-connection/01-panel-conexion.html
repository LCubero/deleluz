<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeleLuz · Panel de conexión</title>
<style>
:root{--bg:#0a0918;--ink:#f5f3ff;--muted:#bdb6dc;--faint:#8f88b3;--glass:rgba(255,255,255,.065);--glass-2:rgba(255,255,255,.11);--line:rgba(255,255,255,.14);--grad:linear-gradient(135deg,#a855f7,#ec4899);--r-lg:24px;--r-md:16px;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.4 var(--font);background:radial-gradient(900px 500px at 10% 10%,#a855f747,transparent 60%),radial-gradient(800px 500px at 90% 80%,#ec489938,transparent 60%),var(--bg)}.board{width:min(100%,920px);margin:auto;padding:24px}.board h1{font-size:26px;margin:0}p{margin:0;color:var(--muted)}main{width:min(100%,920px);margin:auto;padding:0 24px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,412px));justify-content:space-between;gap:24px}figure{margin:0;min-width:0}figcaption{margin:0 0 10px 6px;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}.phone{height:915px;border-radius:44px;border:1px solid var(--line);overflow:hidden;position:relative;display:flex;flex-direction:column;background:radial-gradient(320px 220px at 15% 0%,#a855f74d,transparent 70%),radial-gradient(300px 260px at 100% 70%,#ec48992e,transparent 70%),linear-gradient(180deg,#141129,#0c0a1c);box-shadow:0 0 0 8px #050410,0 30px 80px #0008}.status{height:44px;flex:none;padding:0 26px;font-size:13px;font-weight:600}.row,.status{display:flex;align-items:center;justify-content:space-between;gap:8px}.screen,.sheet{display:flex;flex-direction:column;gap:12px;padding:6px 18px 12px}.screen{flex:1;overflow:auto}.brand{display:flex;align-items:center;gap:8px;font-size:20px}.brand svg{width:30px;height:18px}.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(18px)}button,a{color:inherit;font:inherit}button{cursor:pointer;border:0;background:none}:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}.icon,.btn{min-height:44px;border-radius:14px;background:var(--glass-2);border:1px solid var(--line);font-weight:700}.icon{width:44px;display:grid;place-items:center}.icon svg,nav svg{width:22px;height:22px}.device{padding:12px 16px;display:grid;gap:10px}.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80}.strip{height:14px;border-radius:999px;background:repeating-linear-gradient(90deg,transparent 0 6px,#0007 6px 8px),#ffd6a5;box-shadow:0 0 22px #ffc88c99}.power{display:grid;justify-items:center;gap:6px;text-align:center;padding:12px 0}.power button{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#ffffff1f,#ffffff08 60%),#1b1636;border:1px solid #fff3;box-shadow:0 0 0 6px #a855f72e,0 0 50px #ec489973,inset 0 0 30px #a855f759}.power svg{width:52px;height:52px}.power b{font-size:18px}.small,h3{font-size:13px;color:var(--muted)}h2,h3{margin:0}h2{font-size:22px}h3{text-transform:uppercase;letter-spacing:.08em}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.tile{border-radius:var(--r-md);padding:10px;background:var(--glass);border:1px solid var(--line);font-weight:600;text-align:left;min-height:60px}.sw,.track{display:block;border-radius:999px;height:8px;margin-bottom:6px;background:var(--grad)}.thumb{padding:14px 16px}.track{position:relative;margin:18px 0 10px;height:10px;background:linear-gradient(90deg,#a855f7,#ec4899) 0/80% 100% no-repeat,#ffffff1f}.track::after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:white;left:80%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 4px #a855f766}nav.tabs{height:78px;flex:none;padding:6px 10px 12px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(10,8,24,.82);border-top:1px solid var(--line);backdrop-filter:blur(16px)}nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);text-decoration:none;font-size:12px;font-weight:600;border-radius:14px}nav [aria-current]{color:var(--ink)}nav [aria-current] svg{stroke:#f0abfc;filter:drop-shadow(0 0 8px #ec4899)}.scrim{position:absolute;inset:0;background:rgba(5,4,14,.55)}.sheet{position:absolute;inset:auto 0 0;max-height:90%;overflow:auto;padding:18px 18px 22px;border-radius:28px 28px 0 0;background:linear-gradient(180deg,#201840,#120e26);border-top:1px solid #ffffff38;box-shadow:0 -20px 60px #0009;gap:14px}.grabber{width:44px;height:5px;border-radius:999px;background:#ffffff4d;margin:auto}.scene{padding:12px;border-radius:var(--r-md);background:var(--glass);border:1px solid var(--line)}.scene p{font-size:13px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.btn{padding:0 12px}.danger{color:#fecaca}.primary{background:linear-gradient(135deg,#7e22ce,#be185d);box-shadow:0 8px 24px #ec489959}@media(max-width:880px){main{grid-template-columns:minmax(0,412px);justify-content:center}.board{max-width:460px}}
@media(max-width:390px){main{padding-inline:12px}.screen,.sheet{padding-inline:12px}.device{padding-inline:10px}.device b,.scene b{font-size:13px}.chip{padding-inline:6px;gap:4px}.btn{padding-inline:8px}}
</style></head><body>
<header class="board"><h1>01 · Panel de conexión</h1><p>Toca el estado para gestionar las tiras sin salir de Inicio; el panel cubre parte de la pantalla.</p></header>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient><symbol id="logo" viewBox="0 0 30 18"><path d="M2 14c4-12 8-12 13-5s9 7 13-5" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/></symbol><symbol id="home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></symbol><symbol id="color" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="scenes" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol><symbol id="settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol><symbol id="power" viewBox="0 0 24 24"><path d="M12 3v8M6.3 7.3a8 8 0 1 0 11.4 0"/></symbol><symbol id="timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></symbol></defs></svg>
<main><figure><figcaption>Inicio</figcaption><div class="phone " id="inicio"></div></figure><figure><figcaption>Conexión abierta</figcaption><div class="phone" id="abierta"></div></figure></main>
<template id="home-view"><div class="status" aria-hidden="true"><span>19:42</span><span>5G ▮▮▮</span></div><section class="screen" aria-label="Inicio"><header class="row"><b class="brand"><svg aria-hidden="true"><use href="#logo"/></svg>DeleLuz</b><button class="icon" aria-label="Temporizador"><svg data-icon="timer"></svg></button></header><section class="glass device" aria-label="Tira actual"><div class="row"><b>LEDDMX-03-03C1</b><a class="chip" style="text-decoration:none" href="#conexion" aria-label="Conectado: abrir conexión"><span class="dot"></span>Conectado <span aria-hidden="true">›</span></a></div><div class="strip" role="img" aria-label="Vista previa: blanco cálido"></div></section><div class="power"><button aria-label="Encendido" aria-pressed="true"><svg data-icon="power"></svg></button><b>Encendido · Blanco cálido</b><p class="small">Último comando enviado hace 2 s</p></div><section><div class="row"><h3>Escenas rápidas ›</h3><span class="small" style="color:#f0abfc">Todas las…</span></div><div class="tiles"><button class="tile"><span class="sw" style="background:#ffd6a5"></span>Cálido</button><button class="tile"><span class="sw" style="background:linear-gradient(90deg,#ef4444,#22c55e,#fff7e6)"></span>Navidad</button><button class="tile"><span class="sw" style="background:linear-gradient(90deg,#ef4444,#3b82f6)"></span>Policía</button><button class="tile"><span class="sw" style="background:linear-gradient(90deg,#22c55e,#facc15,#ef4444)"></span>Rasta</button><button class="tile"><span class="sw"></span>Cine</button><button class="tile"><span class="sw" style="background:#fff"></span>Destellos</button></div></section><section class="glass thumb"><div class="row"><b>Velocidad</b><span class="small">Solo para efectos</span></div><div class="track" style="opacity:.5" aria-hidden="true"></div><div class="row"><b>Brillo</b><b>80 %</b></div><div class="track" aria-hidden="true"></div></section></section><nav class="tabs" aria-label="Menú principal"><a href="#inicio" aria-current="page"><svg data-icon="home"></svg>Inicio</a><a href="#color"><svg data-icon="color"></svg>Color</a><a href="#escenas"><svg data-icon="scenes"></svg>Escenas</a><a href="#ajustes"><svg data-icon="settings"></svg>Ajustes</a></nav></template>
<template id="panel"><div class="scrim" aria-hidden="true"></div><section class="sheet" id="conexion" tabindex="-1" aria-labelledby="titulo"><div class="grabber" aria-hidden="true"></div><header class="row"><h2 id="titulo">Conexión</h2><a class="icon" style="text-decoration:none" href="#inicio" aria-label="Volver a la vista de Inicio">×</a></header><h3>Tira recordada</h3><section class="scene"><div class="row"><b>LEDDMX-03-03C1</b><span class="chip"><span class="dot"></span>Conectado</span></div><div class="actions"><button class="btn">Desconectar</button><button class="btn danger">Olvidar tira</button></div></section><h3>Tiras cercanas</h3><section class="scene row"><div><b>LEDDMX-03-A1B2</b><p>Sin conexión</p></div><button class="btn primary">Conectar</button></section><p class="small">Al conectar otra tira, se desconecta la actual y se recuerda la nueva.</p><button class="btn">Buscar de nuevo</button></section></template>
<script>
const home=document.getElementById('home-view');for(const id of ['inicio','abierta'])document.getElementById(id).append(home.content.cloneNode(true));for(const el of document.querySelectorAll('#abierta > *'))el.inert=true;document.getElementById('abierta').append(document.getElementById('panel').content.cloneNode(true));for(const svg of document.querySelectorAll('[data-icon]')){svg.setAttribute('aria-hidden','true');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','2');svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#'+svg.dataset.icon);svg.append(use)}
</script></body></html>
