<main class="board">
<header class="mast"><div><div class="index">DeleLuz / Mobile · Skin 03</div><h1>Prism</h1><p>The light color tints the glass, so controls feel tied to the room—but their accent changes whenever you switch colors.</p></div><div class="key mono"><i></i><span>Active light / Orchid</span></div></header>
<div class="grid" id="board"></div>
</main>
<script>
const $=(s,root=document)=>root.querySelector(s), $$=(s,root=document)=>[...root.querySelectorAll(s)];
const icon=name=>`<svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${name}"/></svg>`;
const tabs=['Devices','Control','Effects','Mode','Pixels'];
const power=`<button class="power" data-power>${icon('power')}<span>Turn off</span></button>`;
const receipt=(target='Shelf strip')=>`<div class="receipt"><span class="gem" aria-hidden="true"></span><div><strong>${target}</strong><small aria-live="polite" data-last>Last sent: Orchid · 64%</small></div></div>`;
const beam=`<div class="beam" role="img" aria-label="Segmented light preview"></div>`;
const dim=(label,value,stepper=false)=>`<div class="meter" data-meter><div class="row between"><label><strong>${label}</strong></label><output>${value}${label==='Brightness'?'%':''}</output></div><div class="row">${stepper?`<button class="step" data-step="-1" aria-label="Decrease ${label.toLowerCase()}">−</button>`:''}<input type="range" min="${label==='Speed'?1:0}" max="100" value="${value}" aria-label="${label}">${stepper?`<button class="step" data-step="1" aria-label="Increase ${label.toLowerCase()}">+</button>`:''}</div></div>`;
const homeHero=`<div class="glass"><div class="row between"><span class="eyebrow">Selected output</span><span class="chip">1 of 2 connected</span></div><h3>Living room (2 strips as one)</h3>${beam}<small>Group preview · offline strips may miss changes</small></div>`;
const devices=`${homeHero}<div class="glass roster"><h3>Remembered strips</h3><div class="item row between"><div><strong>Shelf strip</strong><br><small class="ok"><span class="dot"></span>Connected</small></div><small>150 LEDs</small></div><div class="item"><strong>Ceiling strip</strong><br><small class="wait"><span class="dot"></span>Reconnecting… attempt 2 of 5</small></div></div><div class="glass row between failure"><div><strong>If reconnect fails · Ceiling strip</strong><br><small class="fail" data-error>In use by another phone or app</small></div><button data-retry>Retry</button></div><div class="thumb stack"><h3>Scenes</h3><div class="pair"><button class="scene" style="--sw:#57347f" data-scene="Movie night"><strong>Movie night</strong><small>Orchid · 24%</small></button><button class="scene" style="--sw:#64472c" data-scene="Warm white"><strong>Warm white</strong><small>Soft amber · 72%</small></button></div><div class="glass"><label class="dim"><strong>Brightness</strong><output id="home-level">64%</output><input data-home-level aria-label="Room brightness" type="range" min="0" max="100" value="64"></label><div class="dock row between">${receipt('Living room')}${power}</div></div></div>`;
const quick=`${homeHero}<div class="glass row between"><strong>Ceiling strip</strong><small class="wait">Reconnecting… attempt 2 of 5</small></div><div class="glass quick-menu stack" id="shortcuts"><div class="row between"><div><span class="eyebrow">Pinned by you</span><h3>Quick actions</h3></div><button class="fab" data-close aria-label="Close quick actions">${icon('close')}</button></div><div class="stack" id="action-list"><button class="action" data-all-off>${icon('power')}All off</button><button class="action" data-half>${icon('control')}Brightness 50%</button><button class="action" data-scene="Movie night">${icon('effects')}Scene: Movie night</button><button class="action" data-scene="Warm white">${icon('effects')}Scene: Warm white</button></div><button class="link" data-edit>Edit quick actions</button></div><div class="glass row between closed-receipt">${receipt('Living room')}<button class="fab primary" aria-label="Open quick actions" data-open hidden>${icon('more')}</button></div>`;
const colors=[['Orchid','#DA79FF'],['Warm white','#FFD4A2'],['Ice blue','#8DD6FC'],['Peach','#FF9C98'],['Mint','#A1E5C6']];
const control=`<div class="glass"><div class="row between">${receipt()}${power}</div>${beam}<div class="row between"><small>Local strip preview</small><span class="chip">150 LEDs</span></div></div><div class="glass stack"><div class="row between"><h3>Static color</h3><span class="chip" id="color-name">Orchid</span></div><div class="color-mix"><div class="wheel"><input type="color" aria-label="Pick a light color" value="#da79ff" id="picker"></div><label class="stack"><strong>Exact hex</strong><input class="hex" id="hex" value="#DA79FF" maxlength="7" spellcheck="false" aria-label="Exact hex color"></label></div><small>Recent colors</small><div class="swatches">${colors.map(([name,c])=>`<button data-color="${c}" style="--sw:${c}" aria-label="${name}" title="${name}"></button>`).join('')}</div></div><div class="glass control-knobs">${dim('Brightness',64,true)}${dim('Speed',42,true)}</div>`;
const effects=`<div class="glass stack"><input class="search" type="search" aria-label="Search effects by name or ID" placeholder="Search by name or number"><div class="row" id="filters"><button aria-pressed="true">All</button><button aria-pressed="false">Favorites</button><button aria-pressed="false">Recents</button></div></div><div class="glass stack"><div class="row between"><h3>Native effects</h3><small>Protocol sample</small></div><div class="fx-list" id="fx-list"></div></div><div class="glass bottom stack"><div class="receipt"><span class="gem"></span><div><strong id="effect-name">Forward Run 7 Colors</strong><small>Selected effect · no device read-back</small></div></div>${dim('Speed',42,true)}${dim('Brightness',64,true)}</div>`;
const mode=`<div class="glass stack"><div class="row between"><h3>Evening fade</h3><span class="chip">Local draft</span></div><small>Phone-run sequence · 8 seconds per loop</small><div class="timeline" aria-label="Three clips lasting 2, 4 and 2 seconds"><span style="background:#da79ff">2 s</span><span style="background:#97a9ef">4 s</span><span style="background:#ffd4a2">2 s</span></div><div class="row between mono muted"><span>0:00</span><span>0:04</span><span>0:08</span></div></div><div class="glass stack"><h3>Sequence steps</h3>${[['Orchid','64% · Fade in','2 s','#da79ff'],['Blue dusk','30% · Crossfade','4 s','#97a9ef'],['Warm white','12% · Hold','2 s','#ffd4a2']].map(([name,desc,time,c])=>`<div class="clip"><i style="--sw:${c}"></i><div><strong>${name}</strong><br><small>${desc}</small></div><span class="mono">${time}</span></div>`).join('')}</div><div class="glass stack bottom"><label class="switch-label"><input type="checkbox" checked> Loop sequence</label><p class="hint">Playback is a local preview. The phone would need to stay connected to run this on the strip.</p><div class="pair"><button class="primary" data-play>Preview loop</button><button data-stop>Stop</button></div><small id="mode-status" aria-live="polite">Ready to preview</small></div>`;
const pixels=`<div class="glass stack"><div class="row between"><h3>Shelf strip</h3><span class="chip">Preview</span></div><p class="hint">Per-pixel commands haven’t been found for this strip. Changes stay in the editor.</p></div><div class="glass"><div class="row between"><h3>150 LEDs</h3><small>Data in →</small></div><div class="ruler mono muted"><span>1</span><span>30</span><span>60</span><span>90</span><span>120</span><span>150</span></div><svg class="trace" viewBox="0 0 320 236" role="img" aria-label="150 LEDs in five serpentine rows"></svg></div><div class="glass stack bottom"><label class="stack"><strong>LED numbers or ranges</strong><input class="range" id="range" value="1–20, 45" aria-describedby="selected"></label><div class="row between"><small id="selected" aria-live="polite">21 LEDs selected</small><label class="row">Color <input type="color" id="pixel-color" aria-label="Pixel preview color" value="#da79ff"></label></div><button class="primary" data-keep>Keep preview</button></div>`;
const screens=[['devices','Devices','Living room / Bluetooth','Room overview',devices],['quick','Devices','Living room / Bluetooth','Quick actions open',quick],['control','Control','Shelf strip / Connected','Light mixer',control],['effects','Effects','Shelf strip / Connected','Effect library',effects],['mode','Mode','Shelf strip / Custom mode','Loop builder',mode],['pixels','Pixels','Shelf strip / Pixel editor','Addressable preview',pixels]];
$('#board').innerHTML=screens.map(([id,title,kicker,caption,html],n)=>`<figure><figcaption><b>0${n+1}</b> / ${caption}</figcaption><article class="phone" id="${id}" aria-labelledby="title-${id}"><header class="top"><div class="status"><span>9:41</span><span class="signals" aria-label="Connectivity and battery">▮▮▮ ▰</span></div><div class="eyebrow">${kicker}</div><h2 id="title-${id}">${title}</h2></header><section class="content ${id==='quick'?'quick-stage':''}" aria-label="${caption}">${html}</section><footer class="foot"><nav class="tabs" aria-label="App tabs">${tabs.map(tab=>`<a href="#${tab.toLowerCase()}" ${tab===title?'aria-current="page"':''}>${icon(tab.toLowerCase())}${tab}</a>`).join('')}</nav><div class="gesture" aria-hidden="true"></div></footer></article></figure>`).join('');
let light=colors[0][1],lightName='Orchid',level=64;
function applyColor(c,name){light=c.toUpperCase();lightName=name||colors.find(([,hex])=>hex===light)?.[0]||'Custom';$$('.phone').forEach(p=>p.style.setProperty('--light',light));$('.key i').style.background=light;$('.key span').textContent=`Active light / ${lightName}`;$('#picker').value=light;$('#hex').value=light;$('#hex').setCustomValidity('');$('#color-name').textContent=lightName;['#devices','#quick','#control'].forEach(id=>update($(id)));}
function update(phone){const b=$('[data-power] span',phone);if(b)b.textContent=phone.classList.contains('off')?'Turn on':'Turn off';const last=$('[data-last]',phone);if(last)last.textContent=phone.classList.contains('off')?'Preview: Power off':`Preview: ${lightName} · ${level}%`;}
$$('[data-power]').forEach(b=>b.onclick=()=>{const p=b.closest('.phone');p.classList.toggle('off');update(p)});
$$('[data-scene]').forEach(b=>b.onclick=()=>{const warm=b.dataset.scene==='Warm white';level=warm?72:24;b.closest('.phone').classList.remove('off');applyColor(warm?colors[1][1]:colors[0][1]);$('[data-home-level]').value=level;$('#home-level').textContent=level+'%'});
$('[data-home-level]').oninput=e=>{level=+e.target.value;$('#home-level').textContent=level+'%';update($('#devices'))};
$('[data-all-off]').onclick=()=>{['#quick','#devices','#control'].forEach(id=>{$(id).classList.add('off');update($(id))})};
$('[data-half]').onclick=()=>{level=50;$('[data-home-level]').value=50;$('#home-level').textContent='50%';update($('#quick'));update($('#devices'))};
$('[data-retry]').onclick=()=>{$('[data-error]').textContent='Preview: retry queued. Close the other app first.'};
function quickOpen(open){$('#shortcuts').hidden=!open;$('[data-open]').hidden=open;(open?$('[data-close]'):$('[data-open]')).focus()}
$('[data-close]').onclick=()=>quickOpen(false);$('[data-open]').onclick=()=>quickOpen(true);$('#quick').onkeydown=e=>{if(e.key==='Escape'&&!$('#shortcuts').hidden)quickOpen(false)};
$('#devices .top').insertAdjacentHTML('beforeend',`<a class="home-fab" href="#quick" aria-label="Open quick actions">${icon('more')}</a>`);
$('[data-edit]').onclick=e=>{const editing=e.target.textContent==='Edit quick actions';e.target.textContent=editing?'Done editing':'Edit quick actions';$$('.action').forEach(b=>{if(editing){let label=document.createElement('label');label.className='switch-label';let check=document.createElement('input');check.type='checkbox';check.checked=!b.hidden;label.append(check,b.textContent);b.after(label);b.hidden=true}else{const label=b.nextElementSibling;b.hidden=!$('input',label).checked;label.remove()}})};
$$('[data-meter]').forEach(m=>{const r=$('input',m),o=$('output',m),bright=r.getAttribute('aria-label')==='Brightness';r.oninput=()=>{o.textContent=r.value+(bright?'%':'');if(bright&&m.closest('#control')){level=+r.value;update($('#control'))}};$$('[data-step]',m).forEach(b=>b.onclick=()=>{Number(b.dataset.step)>0?r.stepUp():r.stepDown();r.oninput()})});
$$('[data-color]').forEach(b=>b.onclick=()=>applyColor(b.dataset.color));$('#picker').oninput=e=>applyColor(e.target.value);$('#hex').onchange=e=>{const valid=/^#[0-9a-f]{6}$/i.test(e.target.value);e.target.setCustomValidity(valid?'':'Enter a hex color such as #DA79FF.');if(valid)applyColor(e.target.value);else e.target.reportValidity()};
// IDs are limited to those listed in docs/PROTOCOL.md. Names use the Classic transcription.
const fx=[[95,'Forward Run 7 Colors'],[96,'Backward Run 7 Colors'],[53,'Forward Streaming CN/VT'],['AUTO','Automatic cycling']];
const favorites=new Set([95]),recent=new Set([95,53]);let filter='All',active=95;
function drawFx(){const q=$('.search').value.trim().toLowerCase();const items=fx.filter(([id,name])=>`${id} ${name}`.toLowerCase().includes(q)&&(filter==='All'||(filter==='Favorites'?favorites:recent).has(id)));$('#fx-list').innerHTML=items.map(([id,name])=>`<div class="fx-row"><button data-fx="${id}" aria-pressed="${id===active}"><span class="mono">${id}</span>${name}</button><button data-fav="${id}" aria-pressed="${favorites.has(id)}" aria-label="Favorite ${name}">${favorites.has(id)?'★':'☆'}</button></div>`).join('')||'<p class="hint">No matches. Try a different search or filter.</p>';}
$('.search').oninput=drawFx;$$('#filters button').forEach(b=>b.onclick=()=>{filter=b.textContent;$$('#filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));drawFx()});$('#fx-list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const kind=b.hasAttribute('data-fx')?'fx':'fav',key=b.dataset[kind],id=key==='AUTO'?key:+key;if(kind==='fx'){active=id;recent.add(id);$('#effect-name').textContent=fx.find(x=>x[0]===id)[1]}else favorites.has(id)?favorites.delete(id):favorites.add(id);drawFx();($(`[data-${kind}="${key}"]`)||$('#filters [aria-pressed=true]')).focus()};drawFx();
let timer;const play=()=>{clearInterval(timer);let frame=0;const beats=['Orchid · Fade in','Blue dusk · Crossfade','Warm white · Hold'];const tick=()=>{if(frame>=8&&!$('.switch-label input',$('#mode')).checked){stop('Preview complete');return}const t=frame++%8;$('#mode-status').textContent=`${t+1} / 8 s · ${beats[t<2?0:t<6?1:2]}`};tick();timer=setInterval(tick,1000)};const stop=(text='Preview stopped')=>{clearInterval(timer);$('#mode-status').textContent=text};$('[data-play]').onclick=play;$('[data-stop]').onclick=()=>stop();
const trace=$('.trace'),range=$('#range'),paint=$('#pixel-color');
function drawPixels(){const ids=new Set();let valid=true;for(const part of range.value.split(',')){const m=part.trim().match(/^(\d+)(?:\s*[-–]\s*(\d+))?$/);if(!m||+m[1]<1||+(m[2]||m[1])>150||+m[1]>+(m[2]||m[1])){valid=false;break}for(let i=+m[1];i<=+(m[2]||m[1]);i++)ids.add(i)}if(!valid)ids.clear();let markup='<path d="M16 18H306Q318 18 318 40Q318 62 306 62H16Q4 62 4 84Q4 106 16 106H306Q318 106 318 128Q318 150 306 150H16Q4 150 4 172Q4 194 16 194H306" stroke="#5c5362" stroke-width="4" fill="none"/>';for(let r=0;r<5;r++){let a=1+r*30,y=18+r*44;markup+=`<text x="16" y="${y+24}" fill="#e0d6e5" font-size="12">${r%2?a+29:a}</text><text x="306" y="${y+24}" text-anchor="end" fill="#e0d6e5" font-size="12">${r%2?a:a+29}</text>`;for(let i=0;i<30;i++){const id=a+i;markup+=`<circle data-led="${id}" cx="${16+10*(r%2?29-i:i)}" cy="${y}" r="${ids.has(id)?4.3:3.3}" fill="${ids.has(id)?paint.value:'#b4a5bc'}"><title>LED ${id}</title></circle>`}}trace.innerHTML=markup;$('#selected').textContent=valid?`${ids.size} ${ids.size===1?'LED':'LEDs'} selected`:'Use LEDs 1–150, e.g. 1–20, 45.';$('[data-keep]').disabled=!valid;}
range.oninput=paint.oninput=drawPixels;trace.onclick=e=>{if(e.target.dataset.led){range.value=e.target.dataset.led;drawPixels()}};$('[data-keep]').onclick=()=>{$('#selected').textContent+=' · kept for this session'};drawPixels();
</script>
</body></html>
