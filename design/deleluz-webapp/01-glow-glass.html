<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeleLuz webapp · Glow Glass</title>
<style>
  :root{
    --bg:#0a0918; --ink:#f5f3ff; --muted:#bdb6dc; --faint:#8f88b3;
    --glass:rgba(255,255,255,.065); --glass-2:rgba(255,255,255,.11); --line:rgba(255,255,255,.14);
    --violet:#a855f7; --magenta:#ec4899; --cyan:#22d3ee; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --grad:linear-gradient(135deg,#a855f7 0%,#ec4899 100%);
    --r-lg:24px; --r-md:16px; --r-sm:12px;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);
    background-image:radial-gradient(900px 500px at 10% 10%,rgba(168,85,247,.28),transparent 60%),
      radial-gradient(800px 500px at 90% 80%,rgba(236,72,153,.22),transparent 60%),
      radial-gradient(700px 400px at 55% 40%,rgba(34,211,238,.12),transparent 60%);}
  header.board{padding:28px 40px 8px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header.board h1{margin:0;font-size:26px;letter-spacing:-.02em}
  header.board p{margin:0;color:var(--muted)}
  main.row{display:flex;gap:36px;padding:24px 40px 48px;align-items:flex-start;overflow-x:auto}
  figure{margin:0;flex:0 0 auto}
  figcaption{color:var(--muted);font-size:13px;margin:0 0 10px 6px;text-transform:uppercase;letter-spacing:.08em}

  .phone{width:390px;height:844px;border-radius:44px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#141129,#0c0a1c);border:1px solid var(--line);
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #050410,0 0 60px rgba(168,85,247,.18);
    display:flex;flex-direction:column}
  .phone::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(320px 220px at 15% 0%,rgba(168,85,247,.30),transparent 70%),
      radial-gradient(300px 260px at 100% 70%,rgba(236,72,153,.18),transparent 70%)}
  .status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600;position:relative}
  .screen{flex:1;padding:6px 18px 12px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}

  .glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .top{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:-.01em}
  .brand svg{width:30px;height:18px}
  h2{margin:0;font-size:22px;letter-spacing:-.02em}
  h3{margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .muted{color:var(--muted)} .small{font-size:13px}

  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:14px}
  .chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 12px;border-radius:999px;
    background:var(--glass-2);border:1px solid var(--line);font-size:13px;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .dot.bad{background:var(--bad);box-shadow:0 0 10px var(--bad)}
  .icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line)}
  .icon-btn svg{width:22px;height:22px}

  /* strip preview */
  .strip{height:14px;border-radius:999px;position:relative;overflow:hidden;
    background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.45) 6px 8px),var(--strip,linear-gradient(90deg,#ffd9a8,#ffd9a8));
    box-shadow:0 0 22px var(--glow,rgba(255,200,140,.55))}
  .strip.anim{background-size:auto,200% 100%;animation:run 3s linear infinite}
  @keyframes run{to{background-position:0 0,-200% 0}}

  /* home */
  .device{padding:16px;display:flex;flex-direction:column;gap:14px}
  .device-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .power-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0}
  .power{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;position:relative;
    background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.18),rgba(255,255,255,.04) 60%),#1b1636;
    border:1px solid rgba(255,255,255,.2);box-shadow:0 0 0 6px rgba(168,85,247,.18),0 0 50px rgba(236,72,153,.45),inset 0 0 30px rgba(168,85,247,.35)}
  .power svg{width:56px;height:56px}
  .power-label{font-weight:700;font-size:18px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{min-height:60px;border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
    text-align:left;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--glass)}
  .tile .sw{height:8px;border-radius:999px}
  .tile[aria-pressed="true"]{border-color:transparent;background:linear-gradient(var(--glass-2),var(--glass-2)) padding-box,var(--grad) border-box;border:2px solid transparent}
  .thumb{margin-top:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .slider-head{display:flex;justify-content:space-between;align-items:center;font-weight:600}
  .range{position:relative;height:44px;display:flex;align-items:center}
  .track{height:10px;border-radius:999px;width:100%;background:rgba(255,255,255,.12);position:relative}
  .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--grad);box-shadow:0 0 16px rgba(236,72,153,.6)}
  .knob{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(168,85,247,.4),0 4px 12px rgba(0,0,0,.4)}
  .quick{display:flex;gap:10px}
  .btn{min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{background:var(--grad);box-shadow:0 8px 24px rgba(236,72,153,.35)}
  .btn.ghost{background:var(--glass-2);border:1px solid var(--line)}
  .btn.white{background:#fff5e6;color:#1a1230}
  .btn.grow{flex:1}

  /* tabs */
  nav.tabs{height:78px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 10px 18px;position:relative;
    background:rgba(10,8,24,.72);border-top:1px solid var(--line);backdrop-filter:blur(16px)}
  nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);text-decoration:none;font-size:12px;font-weight:600;border-radius:14px}
  nav.tabs a svg{width:22px;height:22px}
  nav.tabs a[aria-current="page"]{color:var(--ink)}
  nav.tabs a[aria-current="page"] svg{filter:drop-shadow(0 0 8px var(--magenta));stroke:#f0abfc}

  /* color */
  .seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
  .seg button{min-height:40px;border-radius:10px;font-weight:600;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--glass-2);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .wheel{width:250px;height:250px;border-radius:50%;margin:4px auto 0;position:relative;
    background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red);box-shadow:0 0 60px rgba(168,85,247,.35)}
  .wheel::after{content:"";position:absolute;inset:58px;border-radius:50%;background:#100d22;border:1px solid var(--line)}
  .wheel .cur{position:absolute;inset:78px;border-radius:50%;background:#ff3d9a;z-index:1;box-shadow:0 0 30px #ff3d9a}
  .wheel .handle{position:absolute;width:30px;height:30px;border-radius:50%;border:4px solid #fff;top:10px;left:178px;background:#ff3d9a;z-index:2;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .swatch{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
  .swatch[aria-pressed="true"]{outline:3px solid #fff;outline-offset:2px}

  /* scenes */
  .list{display:flex;flex-direction:column;gap:10px}
  .scene{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);text-align:left;min-height:64px}
  .scene .strip{width:64px;height:10px;flex:0 0 auto}
  .scene .meta{flex:1;display:flex;flex-direction:column}
  .scene .meta b{font-size:15px}
  .tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .sheet{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 22px;border-radius:28px 28px 0 0;
    background:linear-gradient(180deg,rgba(32,24,64,.92),rgba(18,14,38,.97));border-top:1px solid rgba(255,255,255,.22);
    box-shadow:0 -20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:14px;z-index:5}
  .grabber{width:44px;height:5px;border-radius:999px;background:rgba(255,255,255,.3);margin:0 auto}
  .scrim{position:absolute;inset:0;background:rgba(5,4,14,.55);z-index:4}
  .note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);font-size:13px;color:#fde68a}
  .note svg{flex:0 0 18px;width:18px;height:18px;margin-top:1px}
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .opt{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-weight:700}
  .opt[aria-pressed="true"]{background:var(--grad);border-color:transparent}

  /* help */
  .banner{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-md);background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4)}
  .banner .meta{flex:1}
  .acc{border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);overflow:hidden}
  .acc > button{width:100%;min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:600;text-align:left}
  .acc ol{margin:0;padding:0 16px 14px 34px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:6px}
  .acc[data-open] > button{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){.strip.anim{animation:none}}
</style>
</head>
<body>
<header class="board">
  <h1>DeleLuz · Glow Glass</h1>
  <p>Thumb First base, frosted violet-magenta glass. Five key states of V1.</p>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <symbol id="i-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></symbol>
    <symbol id="i-color" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-scenes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14"/><path d="M12 17.5h.01"/></symbol>
    <symbol id="i-bt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9 2h6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></symbol>
  </defs>
</svg>

<main class="row">

<!-- 1 HOME -->
<figure>
  <figcaption>1 · Home</figcaption>
  <div class="phone" role="region" aria-label="Home screen">
    <div class="status"><span>19:42</span><span>5G ▮▮▮</span></div>
    <div class="screen">
      <div class="top">
        <div class="brand"><svg viewBox="0 0 30 18" aria-hidden="true"><path d="M2 14c4-12 8-12 13-5s9 7 13-5" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/></svg>DeleLuz</div>
        <button class="icon-btn" aria-label="Off timer"><svg><use href="#i-timer"/></svg></button>
      </div>

      <section class="glass device" aria-label="Device">
        <div class="device-row">
          <div><b>LEDDMX-03</b><div class="small muted">Living room strip · 150 LEDs</div></div>
          <span class="chip"><span class="dot" aria-hidden="true"></span>Connected</span>
        </div>
        <div class="strip" style="--strip:linear-gradient(90deg,#ffd6a5,#ffd6a5);--glow:rgba(255,200,140,.6)" aria-label="Strip preview: warm white"></div>
      </section>

      <div class="power-wrap">
        <button class="power" aria-pressed="true" aria-label="Power: on"><svg><use href="#i-power"/></svg></button>
        <div class="power-label">On · Warm white</div>
        <div class="small muted">Last command sent 2 s ago</div>
      </div>

      <section aria-labelledby="qs">
        <div class="top" style="margin-bottom:10px"><h3 id="qs">Quick scenes</h3><a class="small" style="color:#f0abfc" href="#">All scenes</a></div>
        <div class="grid3">
          <button class="tile" aria-pressed="true"><span class="sw" style="background:#ffd6a5;box-shadow:0 0 10px #ffd6a5"></span>Warm</button>
          <button class="tile"><span class="sw" style="background:linear-gradient(90deg,#ef4444,#22c55e,#fff7e6)"></span>Christmas</button>
          <button class="tile"><span class="sw" style="background:linear-gradient(90deg,#ef4444,#3b82f6)"></span>Police</button>
          <button class="tile"><span class="sw" style="background:linear-gradient(90deg,#22c55e,#facc15,#ef4444)"></span>Rasta</button>
          <button class="tile"><span class="sw" style="background:linear-gradient(90deg,#7c3aed,#ec4899)"></span>Movie night</button>
          <button class="tile"><span class="sw" style="background:#fff;opacity:.85"></span>Flashing</button>
        </div>
      </section>

      <section class="glass thumb" aria-label="Brightness and white">
        <div class="slider-head"><span style="display:flex;gap:8px;align-items:center"><svg width="20" height="20"><use href="#i-sun"/></svg>Brightness</span><span>80%</span></div>
        <div class="range"><div class="track"><div class="fill" style="width:80%"></div><div class="knob" style="left:80%"></div></div></div>
        <div class="quick"><button class="btn white grow">White</button><button class="btn ghost grow">Warm white</button></div>
      </section>
    </div>
    <nav class="tabs" aria-label="Main">
      <a href="#" aria-current="page"><svg><use href="#i-home"/></svg>Home</a>
      <a href="#"><svg><use href="#i-color"/></svg>Color</a>
      <a href="#"><svg><use href="#i-scenes"/></svg>Scenes</a>
      <a href="#"><svg><use href="#i-help"/></svg>Help</a>
    </nav>
  </div>
</figure>

<!-- 2 COLOR -->
<figure>
  <figcaption>2 · Color</figcaption>
  <div class="phone" role="region" aria-label="Color screen">
    <div class="status"><span>19:43</span><span>5G ▮▮▮</span></div>
    <div class="screen">
      <div class="top"><h2>Color</h2><span class="chip"><span class="dot" aria-hidden="true"></span>LEDDMX-03</span></div>
      <div class="seg" role="group" aria-label="Mode">
        <button aria-pressed="true">Solid</button><button aria-pressed="false">Built-in effects</button>
      </div>
      <div class="wheel" role="slider" aria-label="Hue" aria-valuenow="330" aria-valuemin="0" aria-valuemax="360"><div class="cur"></div><div class="handle"></div></div>
      <div class="swatches" role="group" aria-label="Quick colors" style="justify-content:center">
        <button class="swatch" style="background:#ef4444" aria-label="Red"></button>
        <button class="swatch" style="background:#f97316" aria-label="Orange"></button>
        <button class="swatch" style="background:#facc15" aria-label="Yellow"></button>
        <button class="swatch" style="background:#22c55e" aria-label="Green"></button>
        <button class="swatch" style="background:#22d3ee" aria-label="Cyan"></button>
        <button class="swatch" style="background:#3b82f6" aria-label="Blue"></button>
        <button class="swatch" style="background:#ff3d9a" aria-label="Pink" aria-pressed="true"></button>
        <button class="swatch" style="background:#fff5e6" aria-label="White"></button>
      </div>
      <section class="glass thumb" aria-label="Brightness">
        <div class="slider-head"><span>Brightness</span><span>80%</span></div>
        <div class="range"><div class="track"><div class="fill" style="width:80%"></div><div class="knob" style="left:80%"></div></div></div>
        <div class="small muted">Changes are sent as you drag, at most every 150 ms.</div>
      </section>
    </div>
    <nav class="tabs" aria-label="Main">
      <a href="#"><svg><use href="#i-home"/></svg>Home</a>
      <a href="#" aria-current="page"><svg><use href="#i-color"/></svg>Color</a>
      <a href="#"><svg><use href="#i-scenes"/></svg>Scenes</a>
      <a href="#"><svg><use href="#i-help"/></svg>Help</a>
    </nav>
  </div>
</figure>

<!-- 3 SCENES + PREVIEW -->
<figure>
  <figcaption>3 · Scenes · preview before apply</figcaption>
  <div class="phone" role="region" aria-label="Scenes screen with preview">
    <div class="status"><span>19:44</span><span>5G ▮▮▮</span></div>
    <div class="screen">
      <div class="top"><h2>Scenes</h2><button class="icon-btn" aria-label="New scene"><svg><use href="#i-plus"/></svg></button></div>
      <div class="seg" role="group" aria-label="Scene source"><button aria-pressed="true">Included</button><button aria-pressed="false">Mine · 2</button></div>
      <div class="list">
        <button class="scene"><span class="strip anim" style="--strip:linear-gradient(90deg,#ef4444,#22c55e,#fff7e6,#ef4444);--glow:rgba(239,68,68,.4)"></span><span class="meta"><b>Christmas moving</b><span class="small muted">Red · green · warm white fades</span></span><span class="tag">Page</span></button>
        <button class="scene"><span class="strip" style="--strip:linear-gradient(90deg,#ef4444,#22c55e);--glow:rgba(34,197,94,.4)"></span><span class="meta"><b>Christmas glow</b><span class="small muted">Breathes red ↔ green</span></span><span class="tag">Page</span></button>
        <button class="scene"><span class="strip" style="--strip:linear-gradient(90deg,#ef4444,#3b82f6);--glow:rgba(59,130,246,.4)"></span><span class="meta"><b>Police</b><span class="small muted">Double flash red · blue</span></span><span class="tag">Page</span></button>
        <button class="scene"><span class="strip" style="--strip:linear-gradient(90deg,#a855f7,#22d3ee,#facc15);--glow:rgba(168,85,247,.4)"></span><span class="meta"><b>Effect 12</b><span class="small muted">Built into the controller · speed 60</span></span><span class="tag">Built-in</span></button>
      </div>
    </div>
    <div class="scrim" aria-hidden="true"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="pv">
      <div class="grabber" aria-hidden="true"></div>
      <div class="top"><h2 id="pv">Christmas moving</h2><span class="tag">Page</span></div>
      <div class="strip anim" style="height:22px;--strip:linear-gradient(90deg,#ef4444,#22c55e,#fff7e6,#ef4444);--glow:rgba(239,68,68,.55)" aria-label="Preview on screen"></div>
      <div>
        <div class="slider-head"><span>Step interval</span><span>400 ms</span></div>
        <div class="range"><div class="track"><div class="fill" style="width:30%"></div><div class="knob" style="left:30%"></div></div></div>
      </div>
      <div class="note"><svg><use href="#i-info"/></svg><span>This scene is played by this page. Keep it open and in front; the strip stays on its last color if you leave.</span></div>
