<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis Escenas · Galería + hoja</title><style>
:root{color-scheme:dark;--ink:#f5f3ff;--muted:#bdb6dc;--glass:#ffffff11;--line:#ffffff24;--grad:linear-gradient(135deg,#be185d,#7e22ce);--nav:68px;--base:max(0px,calc((100dvh - 844px) / 2))}*{box-sizing:border-box}body{margin:0;background:#0a0918;color:var(--ink);font:.9375rem/1.4 system-ui,sans-serif}.phone{width:min(100%,390px);height:min(100dvh,844px);margin:auto;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:radial-gradient(320px 220px at 15% 0%,#a855f74d,transparent 70%),radial-gradient(300px 260px at 100% 70%,#ec48992e,transparent 70%),linear-gradient(#141129,#0c0a1c)}main{flex:1;overflow:auto;padding:16px}h1,h2,p{margin:0}h1{font-size:1.5rem}h2{font-size:1.125rem}p,small,label,.brand{color:var(--muted)}.brand{font-size:.75rem;letter-spacing:.1em;font-weight:700}.row,.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row{justify-content:space-between}button,input{font:inherit}button{min-height:44px;min-width:44px;color:inherit;border:1px solid var(--line);border-radius:14px;background:#ffffff1c;padding:0 10px;cursor:pointer}.primary{background:var(--grad);font-weight:700}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-block:10px}.tile{text-align:left;min-height:70px;padding:9px;border-radius:16px;background:var(--glass);backdrop-filter:blur(18px);overflow-wrap:anywhere}.thumb{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.thumb i{background:var(--c);width:16px;height:16px;border-radius:4px}dialog{position:fixed;inset:auto 0 calc(var(--nav) + var(--base));margin:0 auto;width:min(calc(100% - 2px),388px);max-width:none;max-height:calc(min(100dvh,844px) - var(--nav) - 12px);padding:12px 16px 14px;border:1px solid var(--line);border-radius:20px 20px 0 0;background:linear-gradient(#201840,#120e26);color:var(--ink);box-shadow:0 -12px 32px #0007;overflow:auto}dialog::backdrop{background:#0004}.nub{width:36px;height:4px;border-radius:14px;background:#bdb6dc;margin:0 auto 4px}.steps{margin:6px 0}.color{width:44px;background:var(--c);padding:0}.color[aria-pressed=true]{box-shadow:0 0 0 2px white inset,0 0 0 2px #a855f7}.picker{border-block:1px solid var(--line);padding-block:5px}.palette{display:grid;grid-template-columns:repeat(4,44px);gap:6px;margin:5px 0}.palette button{border-radius:50%}.custom{display:inline-flex;align-items:center;gap:8px}.custom input{width:44px;height:44px}.sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}.sliders input{width:100%;height:44px;accent-color:#ec4899;margin:0}.play{flex:1}.strip{height:7px;margin:6px 0;border-radius:14px;background:var(--c,#2a2540)}.notice{font-size:.8rem;margin-top:4px}nav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 6px max(6px,env(safe-area-inset-bottom));background:#0a0818d1;border-top:1px solid var(--line)}nav span,nav a{min-height:54px;display:grid;place-content:center;text-align:center;font-size:.7rem;color:var(--muted);text-decoration:none}nav b{font-size:1rem}nav a{background:var(--glass);border-radius:14px;color:var(--ink)}nav a b{color:#f0abfc}:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}[hidden]{display:none!important}
</style></head><body><div class="phone"><main id="mis"><header><div class="brand">◈ DELELUZ</div><div class="row"><h1>Mis Escenas</h1><button class="primary" id="new">+ Nueva</button></div><p>Elige una escena para editarla.</p></header><section class="tiles" id="tiles" aria-label="Escenas guardadas"></section></main><nav aria-label="Pestañas del prototipo"><span><b aria-hidden="true">⌂</b>Inicio</span><span><b aria-hidden="true">◉</b>Color</span><span><b aria-hidden="true">✦</b>Escenas</span><a href="#mis" aria-current="page"><b aria-hidden="true">▦</b>Mis Escenas</a><span><b aria-hidden="true">?</b>Ayuda</span></nav></div><dialog aria-labelledby="scene-title"><div class="nub" aria-hidden="true"></div><div id="editor"></div></dialog><script>
const quick=[['Rosa','#ff68ad'],['Violeta','#a855f7'],['Azul','#548cff'],['Cian','#22d3ee'],['Verde','#4ade80'],['Amarillo','#fbbf24'],['Rojo','#f87171'],['Blanco','#fff5e6']];const scenes=[{name:'Atardecer',c:['#fbbf24','#ff68ad','#a855f7'],v:45,i:75},{name:'Mar en calma',c:['#548cff','#22d3ee','#fff5e6'],v:30,i:60},{name:'Noche violeta',c:['#a855f7','#548cff','#ff68ad'],v:25,i:45},{name:'Luz de fiesta',c:['#f87171','#fbbf24','#4ade80'],v:65,i:80}];const dialog=document.querySelector('dialog'),editor=document.querySelector('#editor'),tiles=document.querySelector('#tiles'),create=document.querySelector('#new');let current=0,step=1,timer,playing=false,frame=0,returnTo='[data-scene="0"]';const scene=()=>scenes[current];
function gallery(){tiles.innerHTML=scenes.map((s,i)=>`<button class="tile" data-scene="${i}"><strong>${s.name}</strong><span class="thumb" aria-hidden="true">${s.c.map(c=>`<i style="--c:${c}"></i>`).join('')}</span></button>`).join('')}
function render(focus){const s=scene();editor.innerHTML=`<div class="row"><div><h2 id="scene-title">${s.name}</h2><small>Toca un cuadro para cambiar su color.</small></div><button data-close autofocus>Listo</button></div><div class="steps">${s.c.map((c,i)=>`<button class="color" style="--c:${c}" data-step="${i}" aria-label="Cuadro ${i+1}: ${quick.find(q=>q[1]===c)?.[0]||c}" aria-pressed="${i===step}"></button>`).join('')}<button data-add aria-label="Añadir cuadro">+</button></div><div class="picker" ${step<0?'hidden':''}><div class="row"><strong>Color del cuadro ${step+1}</strong><button data-remove ${s.c.length<2?'disabled':''}>Quitar cuadro</button></div><div class="palette">${quick.map(([name,c])=>`<button class="color" style="--c:${c}" data-color="${c}" aria-label="${name}" aria-pressed="${s.c[step]===c}"></button>`).join('')}</div><label class="custom">Otro color <input type="color" value="${s.c[step]||s.c[0]}"></label>${s.c.length<2?'<p><small>Deja al menos un cuadro.</small></p>':''}</div><div class="sliders">${[['v','Velocidad'],['i','Intensidad']].map(([k,l])=>`<label>${l} <output>${s[k]}%</output><input data-key="${k}" type="range" min="1" max="100" value="${s[k]}"></label>`).join('')}</div><div class="row"><button class="primary play" data-play>▶ Reproducir</button><button data-stop>■ Detener</button></div><div class="strip" aria-hidden="true"></div><small role="status">Vista previa detenida</small><p class="notice">Toda la tira muestra un color a la vez. Mantén la página abierta mientras se reproduce.</p>`;if(focus)editor.querySelector(focus)?.focus()}
function stop(){clearTimeout(timer);playing=false;editor.querySelector('.strip')?.style.removeProperty('--c');const status=editor.querySelector('[role=status]');if(status)status.textContent='Vista previa detenida'}function tick(){if(!playing)return;const s=scene(),strip=editor.querySelector('.strip');strip.style.setProperty('--c',s.c[frame++%s.c.length]);strip.style.opacity=s.i/100;timer=setTimeout(tick,1600-14*s.v)}function open(i,s,trigger){current=i;step=s;returnTo=trigger;render();dialog.showModal()}
editor.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,s=scene();if('close'in d)dialog.close();else if('step'in d){stop();step=+d.step;render(`[data-step="${step}"]`)}else if('add'in d){stop();step=s.c.push(quick[0][1])-1;render(`[data-step="${step}"]`)}else if('remove'in d&&s.c.length>1){stop();s.c.splice(step,1);step=Math.min(step,s.c.length-1);render(`[data-step="${step}"]`)}else if('color'in d){stop();s.c[step]=d.color;render(`[data-color="${d.color}"]`)}else if('play'in d&&!playing){playing=true;frame=0;editor.querySelector('[role=status]').textContent='Reproduciendo en pantalla';tick()}else if('stop'in d)stop()};editor.oninput=e=>{const x=e.target;if(x.dataset.key){scene()[x.dataset.key]=+x.value;x.previousElementSibling.value=x.value+'%'}};editor.onchange=e=>{if(e.target.type==='color'){stop();scene().c[step]=e.target.value;render('input[type=color]')}};tiles.onclick=e=>{const b=e.target.closest('button');if(b)open(+b.dataset.scene,-1,`[data-scene="${b.dataset.scene}"]`)};create.onclick=()=>open(scenes.push({name:'Escena nueva '+(scenes.length-3),c:[quick[0][1]],v:50,i:75})-1,0,'#new');dialog.addEventListener('close',()=>{stop();gallery();document.querySelector(returnTo)?.focus()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});gallery();open(0,1,returnTo);
</script></body></html>
