<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis Escenas · Tira de cuadritos</title>
<style>
:root{color-scheme:dark;--ink:#f5f3ff;--muted:#bdb6dc;--glass:rgba(255,255,255,.065);--line:rgba(255,255,255,.14);--primary:linear-gradient(135deg,#be185d,#7e22ce)}*{box-sizing:border-box}body{margin:0;background:#0a0918;color:var(--ink);font:.9375rem/1.4 system-ui,sans-serif}.phone{width:min(100%,390px);height:min(100dvh,844px);margin:auto;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:radial-gradient(320px 220px at 15% 0%,#a855f74d,transparent 70%),radial-gradient(300px 260px at 100% 70%,#ec48992e,transparent 70%),linear-gradient(#141129,#0c0a1c)}main{overflow:auto;flex:1;padding:16px;scroll-padding:8px}h1,h2,p{margin:0}h1{font-size:1.5rem}h2{font-size:1rem}.brand,small,p,.label{color:var(--muted)}.brand{letter-spacing:.1em;font-weight:700}.top,.actions,.line,.steps,.palette{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top,.line{justify-content:space-between}.card{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(18px)}button,input{font:inherit}button,.other{min-height:44px;min-width:44px;color:inherit;background:#ffffff1c;border:1px solid var(--line);border-radius:14px;padding:0 10px;cursor:pointer}.primary{background:var(--primary);font-weight:700}.square{width:44px;background:var(--c);padding:0}.square[aria-pressed=true]{box-shadow:0 0 0 2px white inset,0 0 0 2px #a855f7}.steps{margin-block:6px}.panel{border-top:1px solid var(--line);padding-top:6px}.palette{display:grid;grid-template-columns:repeat(4,44px);margin:6px 0}.palette button{border-radius:50%}.other{display:inline-flex;align-items:center;gap:8px}.other input{width:44px;height:44px;padding:4px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}.controls input{width:100%;height:44px;margin:0;accent-color:#ec4899}.actions>*{flex:1}.saved{width:100%;text-align:left;background:none;padding:0;border:0}.mini{display:inline-block;width:17px;height:17px;border-radius:5px;background:var(--c);vertical-align:middle;margin-right:4px}.notice{margin-top:10px;font-size:.8rem}nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px;background:#0a0818d1;border-top:1px solid var(--line)}nav span,nav a{min-height:54px;display:grid;place-content:center;text-align:center;font-size:.7rem;color:var(--muted);text-decoration:none}nav b{font-size:1rem}nav a{background:var(--glass);border-radius:14px;color:#f5f3ff}nav a b{color:#f0abfc}:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}[hidden]{display:none!important}.preview{width:100%;height:8px;border-radius:14px;background:var(--c,#2a2540);margin-top:7px}.tools{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body><div class="phone"><main id="escenas"><header><div class="brand">◈ DELELUZ</div><div class="top"><h1>Mis Escenas</h1><button class="primary" id="new">+ Nueva</button></div><p>Toca un cuadro para cambiar su color.</p></header><section id="list" aria-label="Escenas guardadas"></section><p class="notice">Toda la tira muestra un color a la vez. Mantén esta página abierta mientras se reproduce.</p></main><nav aria-label="Pestañas del prototipo"><span><b aria-hidden="true">⌂</b>Inicio</span><span><b aria-hidden="true">◉</b>Color</span><span><b aria-hidden="true">✦</b>Escenas</span><a href="#escenas" aria-current="page"><b aria-hidden="true">▦</b>Mis Escenas</a><span><b aria-hidden="true">?</b>Ayuda</span></nav></div>
<script>
const colors=[['Rosa','#ff68ad'],['Violeta','#a855f7'],['Azul','#548cff'],['Cian','#22d3ee'],['Verde','#4ade80'],['Amarillo','#fbbf24'],['Rojo','#f87171'],['Blanco','#fff5e6']];
const scenes=[{name:'Atardecer',c:['#fbbf24','#ff68ad','#a855f7'],v:45,i:75},{name:'Mar en calma',c:['#548cff','#22d3ee','#fff5e6'],v:30,i:60}];let active=0,selected=1,timer,playing=false,frame=0;const list=document.querySelector('#list');const square=(c,i)=>`<button class="square" style="--c:${c}" data-step="${i}" aria-label="Cuadro ${i+1}: ${colors.find(x=>x[1]===c)?.[0]||c}" aria-pressed="${selected===i}"></button>`;
function render(focus){list.innerHTML=scenes.map((s,n)=>`<article class="card">${active===n?`<div class="line"><h2>${s.name}</h2><small>${s.c.length} colores</small></div><div class="steps">${s.c.map(square).join('')}<button data-add aria-label="Añadir cuadro">+</button></div><div class="panel" ${selected<0?'hidden':''}><div class="line"><strong>Color del cuadro ${selected+1}</strong><button data-remove ${s.c.length<2?'disabled':''}>Quitar cuadro</button></div><div class="palette" aria-label="Colores rápidos">${colors.map(([name,c])=>`<button class="square" style="--c:${c}" data-color="${c}" aria-label="${name}" aria-pressed="${s.c[selected]===c}"></button>`).join('')}</div><label class="other">Otro color <input type="color" value="${s.c[selected]||s.c[0]}"></label>${s.c.length<2?'<p><small>Deja al menos un cuadro.</small></p>':''}</div><div class="controls">${[['v','Velocidad'],['i','Intensidad']].map(([k,l])=>`<label class="label">${l} <output>${s[k]}%</output><input type="range" min="1" max="100" value="${s[k]}" data-key="${k}"></label>`).join('')}</div><div class="actions"><button class="primary" data-play>▶ Reproducir</button><button data-stop>■ Detener</button></div><div class="preview" aria-hidden="true"></div><small role="status" data-status>Vista previa detenida</small>`:`<button class="saved" data-open="${n}"><strong>${s.name}</strong><br>${s.c.map(c=>`<span class="mini" style="--c:${c}"></span>`).join('')}</button>`}</article>`).join('');if(focus)list.querySelector(focus)?.focus()}
function stop(){clearTimeout(timer);playing=false;const status=list.querySelector('[data-status]');if(status)status.textContent='Vista previa detenida';list.querySelector('.preview')?.style.removeProperty('--c')}
function tick(){if(!playing)return;const s=scenes[active],bar=list.querySelector('.preview');bar.style.setProperty('--c',s.c[frame++%s.c.length]);bar.style.opacity=s.i/100;timer=setTimeout(tick,1600-14*s.v)}
list.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,s=scenes[active];if('open'in d){stop();active=+d.open;selected=-1;render('[data-step]')}else if('step'in d){stop();selected=+d.step;render(`[data-step="${selected}"]`)}else if('add'in d){stop();selected=s.c.push(colors[0][1])-1;render(`[data-step="${selected}"]`)}else if('remove'in d&&s.c.length>1){stop();s.c.splice(selected,1);selected=Math.min(selected,s.c.length-1);render(`[data-step="${selected}"]`)}else if('color'in d){s.c[selected]=d.color;stop();render(`[data-color="${d.color}"]`)}else if('play'in d){if(!playing){playing=true;frame=0;list.querySelector('[data-status]').textContent='Reproduciendo en pantalla';tick()}}else if('stop'in d)stop()};
list.oninput=e=>{const x=e.target;if(x.dataset.key){scenes[active][x.dataset.key]=+x.value;x.previousElementSibling.value=x.value+'%'}};list.onchange=e=>{if(e.target.type==='color'){stop();scenes[active].c[selected]=e.target.value;render('input[type=color]')}};
document.querySelector('#new').onclick=()=>{stop();scenes.unshift({name:'Escena nueva '+(scenes.length-1),c:[colors[0][1]],v:50,i:75});active=0;selected=0;render('[data-step]')};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
</script></body></html>
