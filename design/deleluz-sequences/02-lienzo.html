<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis Escenas · Lienzo</title><style>
:root{color-scheme:dark;--ink:#f5f3ff;--muted:#bdb6dc;--glass:#ffffff11;--line:#ffffff24;--grad:linear-gradient(135deg,#be185d,#7e22ce)}*{box-sizing:border-box}body{margin:0;background:#0a0918;color:var(--ink);font:.9375rem/1.4 system-ui,sans-serif}.phone{width:min(100%,390px);height:min(100dvh,844px);margin:auto;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:radial-gradient(320px 220px at 15% 0%,#a855f74d,transparent 70%),radial-gradient(300px 260px at 100% 70%,#ec48992e,transparent 70%),linear-gradient(#141129,#0c0a1c)}main{flex:1;overflow:auto;padding:16px}h1,h2,p{margin:0}h1{font-size:1.5rem}h2{font-size:1.125rem}p,small,.eyebrow,label{color:var(--muted)}.eyebrow{font-size:.75rem;letter-spacing:.1em;font-weight:700}.row,.steps,.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row{justify-content:space-between}.canvas{margin-block:12px;padding:12px;border:1px solid #a855f780;border-radius:20px;background:var(--glass);backdrop-filter:blur(18px)}button,input{font:inherit}button{min-height:44px;min-width:44px;color:inherit;border:1px solid var(--line);border-radius:14px;background:#ffffff1c;padding:0 10px;cursor:pointer}.primary{background:var(--grad);font-weight:700}.steps{margin:8px 0}.color{width:44px;padding:0;background:var(--c)}.steps .color{width:52px;height:52px}.color[aria-pressed=true]{box-shadow:0 0 0 2px white inset,0 0 0 2px #a855f7}.palette{display:grid;grid-template-columns:repeat(4,44px);gap:6px;margin:6px 0}.palette button{border-radius:50%}.picker{border-block:1px solid var(--line);padding-block:6px}.custom{display:inline-flex;align-items:center;gap:8px}.custom input{width:44px;height:44px}.sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}.sliders input{width:100%;height:44px;accent-color:#ec4899;margin:0}.play{flex:1}.strip{height:8px;margin:6px 0;border-radius:14px;background:var(--c,#2a2540)}.chips{margin-top:6px}.chips button{text-align:left;padding-block:5px}.chips button[aria-pressed=true]{border-color:#f0abfc}.chip-colors{display:flex;gap:4px;flex-wrap:wrap}.chip-colors i{width:13px;height:13px;border-radius:4px;background:var(--c)}.notice{margin-top:8px;font-size:.8rem}nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px;background:#0a0818d1;border-top:1px solid var(--line)}nav span,nav a{min-height:54px;display:grid;place-content:center;text-align:center;font-size:.7rem;color:var(--muted);text-decoration:none}nav b{font-size:1rem}nav a{background:var(--glass);border-radius:14px;color:var(--ink)}nav a b{color:#f0abfc}:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}[hidden]{display:none!important}
</style></head><body><div class="phone"><main id="mis"><header><div class="eyebrow">◈ DELELUZ</div><div class="row"><h1>Mis Escenas</h1><button id="new">+ Nueva</button></div><p>Crea una secuencia sin salir de aquí.</p></header><section class="canvas" id="editor" aria-label="Editor de secuencia"></section><section aria-labelledby="saved"><h2 id="saved">Guardadas</h2><div class="chips" id="chips"></div></section><p class="notice">Toda la tira muestra un color a la vez. Mantén la página abierta mientras se reproduce.</p></main><nav aria-label="Pestañas del prototipo"><span><b aria-hidden="true">⌂</b>Inicio</span><span><b aria-hidden="true">◉</b>Color</span><span><b aria-hidden="true">✦</b>Escenas</span><a href="#mis" aria-current="page"><b aria-hidden="true">▦</b>Mis Escenas</a><span><b aria-hidden="true">?</b>Ayuda</span></nav></div><script>
const quick=[['Rosa','#ff68ad'],['Violeta','#a855f7'],['Azul','#548cff'],['Cian','#22d3ee'],['Verde','#4ade80'],['Amarillo','#fbbf24'],['Rojo','#f87171'],['Blanco','#fff5e6']];const scenes=[{name:'Luz de tarde',c:['#fbbf24','#ff68ad','#a855f7'],speed:50,level:70},{name:'Noche azul',c:['#548cff','#22d3ee','#fff5e6'],speed:35,level:50}];const editor=document.querySelector('#editor'),chips=document.querySelector('#chips');let current=0,step=1,timer,playing=false,frame=0;const scene=()=>scenes[current];
function render(focus){const s=scene();editor.innerHTML=`<div class="eyebrow">EDITANDO</div><h2>${s.name}</h2><small>Toca un cuadro para cambiar su color.</small><div class="steps">${s.c.map((c,i)=>`<button class="color" data-step="${i}" style="--c:${c}" aria-label="Cuadro ${i+1}: ${quick.find(q=>q[1]===c)?.[0]||c}" aria-pressed="${i===step}"></button>`).join('')}<button data-add aria-label="Añadir cuadro">+</button></div><div class="picker" ${step<0?'hidden':''}><div class="row"><strong>Color del cuadro ${step+1}</strong><button data-remove ${s.c.length<2?'disabled':''}>Quitar cuadro</button></div><div class="palette">${quick.map(([name,c])=>`<button class="color" style="--c:${c}" data-color="${c}" aria-label="${name}" aria-pressed="${s.c[step]===c}"></button>`).join('')}</div><label class="custom">Otro color <input type="color" value="${s.c[step]||s.c[0]}"></label>${s.c.length<2?'<p><small>Deja al menos un cuadro.</small></p>':''}</div><div class="sliders">${[['speed','Velocidad'],['level','Intensidad']].map(([k,l])=>`<label>${l} <output>${s[k]}%</output><input data-key="${k}" type="range" min="1" max="100" value="${s[k]}"></label>`).join('')}</div><div class="row"><button class="primary play" data-play>▶ Reproducir</button><button data-stop>■ Detener</button></div><div class="strip" aria-hidden="true"></div><small role="status">Vista previa detenida</small>`;chips.innerHTML=scenes.map((s,i)=>`<button data-scene="${i}" aria-pressed="${i===current}">${s.name}<span class="chip-colors" aria-hidden="true">${s.c.map(c=>`<i style="--c:${c}"></i>`).join('')}</span></button>`).join('');if(focus)editor.querySelector(focus)?.focus()}
function stop(){clearTimeout(timer);playing=false;editor.querySelector('.strip')?.style.removeProperty('--c');const status=editor.querySelector('[role=status]');if(status)status.textContent='Vista previa detenida'}function play(){if(!playing)return;const s=scene(),strip=editor.querySelector('.strip');strip.style.setProperty('--c',s.c[frame++%s.c.length]);strip.style.opacity=s.level/100;timer=setTimeout(play,1600-14*s.speed)}
editor.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,s=scene();if('step'in d){stop();step=+d.step;render(`[data-step="${step}"]`)}else if('add'in d){stop();step=s.c.push(quick[0][1])-1;render(`[data-step="${step}"]`)}else if('remove'in d&&s.c.length>1){stop();s.c.splice(step,1);step=Math.min(step,s.c.length-1);render(`[data-step="${step}"]`)}else if('color'in d){stop();s.c[step]=d.color;render(`[data-color="${d.color}"]`)}else if('play'in d&&!playing){playing=true;frame=0;editor.querySelector('[role=status]').textContent='Reproduciendo en pantalla';play()}else if('stop'in d)stop()};editor.oninput=e=>{const x=e.target;if(x.dataset.key){scene()[x.dataset.key]=+x.value;x.previousElementSibling.value=x.value+'%'}};editor.onchange=e=>{if(e.target.type==='color'){stop();scene().c[step]=e.target.value;render('input[type=color]')}};chips.onclick=e=>{const b=e.target.closest('button');if(!b)return;stop();current=+b.dataset.scene;step=-1;render('[data-step]')};document.querySelector('#new').onclick=()=>{stop();current=scenes.push({name:'Escena nueva '+(scenes.length-1),c:[quick[0][1]],speed:50,level:75})-1;step=0;render('[data-step]')};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
</script></body></html>
