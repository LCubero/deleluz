<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disco y blancos · DeleLuz</title><style>
:root{--bg:#0a0918;--ink:#f5f3ff;--muted:#bdb6dc;--faint:#8f88b3;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.11);--line:rgba(255,255,255,.14);--grad:linear-gradient(135deg,#a855f7,#ec4899);color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.phone{max-width:480px;margin:auto;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:radial-gradient(320px 220px at 15% 0%,rgba(168,85,247,.28),transparent 70%),radial-gradient(300px 350px at 100% 72%,rgba(236,72,153,.18),transparent 72%),var(--bg)}header,main{padding:0 16px}main{overflow:auto;padding-bottom:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.status{font-size:12px;padding:9px 10px}.head{margin:8px 0 12px}h1{font-size:24px;margin:0}h2,p{margin:0}h2{font-size:15px}.badge{background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-weight:650;font-size:13px}.badge::before{content:'●';color:#4ade80;margin-right:7px}.seg,nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;text-align:center}.seg{background:var(--glass);border:1px solid var(--line);padding:3px;border-radius:16px}.seg span,nav span{display:grid;place-content:center;min-height:44px;color:var(--muted);font-weight:650;border-radius:12px;font-size:14px}.seg [aria-current]{background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}nav{background:var(--bg);border-top:1px solid var(--line);padding:5px 8px 8px}nav span{font-size:12px;color:var(--faint)}nav b{font-size:19px}nav [aria-current]{color:var(--ink)}nav [aria-current] b{color:#f0abfc;text-shadow:0 0 8px #ec4899}.card{border:1px solid var(--line);border-radius:24px;background:var(--glass);padding:12px 14px;margin-top:10px}.disc{width:clamp(156px,55vw,216px);aspect-ratio:1;border-radius:50%;margin:14px auto 8px;background:radial-gradient(circle closest-side,#fff,transparent),conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red);position:relative;box-shadow:0 0 38px rgba(168,85,247,.25)}.disc::after{content:'';position:absolute;left:62%;top:28%;width:23px;height:23px;border:3px solid white;border-radius:50%;background:#ffcc9c;box-shadow:0 2px 8px #0a0918}.caption{text-align:center;color:var(--muted);font-size:13px}.preview{display:flex;align-items:center;gap:7px}.preview::before{content:'';width:18px;height:18px;border-radius:50%;background:var(--sample,#ffcc9c)}.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}button{font:inherit;font-size:13px;font-weight:600;color:inherit;min-height:48px;min-width:44px;border:1px solid var(--line);border-radius:12px;background:var(--glass2);cursor:pointer}button::before{content:'';display:block;margin:0 auto 3px;width:74%;height:7px;border-radius:8px;background:var(--tone)}button[aria-pressed=true]{border-color:#f5f3ff}input{appearance:none;width:100%;height:44px;margin:0;background:transparent}input::-webkit-slider-runnable-track{height:9px;border-radius:20px;background:var(--grad)}input::-webkit-slider-thumb{appearance:none;width:23px;height:23px;margin-top:-7px;background:white;border-radius:50%;box-shadow:0 0 0 4px #5c3488}:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><div class="phone"><header><div class="row status" aria-hidden="true"><span>11:39</span><span>▮▮▮ 100 %</span></div><div class="row head"><h1>Color</h1><span class="badge">Conectado</span></div><div class="seg" aria-label="Modo"><span aria-current="true">Color fijo</span><span>Efectos integrados</span></div></header><main><div class="disc" role="img" aria-label="Disco de tono y saturación: blanco en el centro, color intenso hacia el borde"></div><p class="caption">Centro: blanco · Borde: color intenso</p><section class="card row" aria-label="Vista previa de la tira"><strong class="preview">Sala</strong><span class="caption">LEDDMX-03-03C1</span></section><section class="card"><h2>Blancos</h2><div class="scale"><button aria-pressed="false" style="--tone:#ffe0ba">Cálido</button><button aria-pressed="false" style="--tone:#fff">Neutro</button><button aria-pressed="false" style="--tone:#d9e8ff">Frío</button></div></section><section class="card"><label class="row" for="brightness"><strong>Brillo</strong><output for="brightness">71 %</output></label><input type="range" id="brightness" value="71"></section></main><nav aria-label="Menú principal"><span><b aria-hidden="true">⌂</b>Inicio</span><span aria-current="page"><b aria-hidden="true">◎</b>Color</span><span><b aria-hidden="true">◇</b>Escenas</span><span><b aria-hidden="true">☷</b>Ajustes</span></nav></div><script>const chips=[...document.querySelectorAll('button')];chips.forEach(b=>b.onclick=()=>{chips.forEach(c=>c.setAttribute('aria-pressed',String(c===b)));document.querySelector('.preview').style.setProperty('--sample',b.style.getPropertyValue('--tone'));});document.querySelector('input').oninput=e=>document.querySelector('output').value=e.target.value+' %';</script></html>
