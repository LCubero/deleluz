<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duración con rueda · DeleLuz</title><style>
:root{--bg:#0a0918;--ink:#f5f3ff;--muted:#bdb6dc;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.11);--line:rgba(255,255,255,.14);--grad:linear-gradient(135deg,#a855f7,#ec4899);color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.phone{position:relative;isolation:isolate;max-width:480px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(320px 220px at 15% 0%,rgba(168,85,247,.28),transparent 70%),radial-gradient(300px 350px at 100% 72%,rgba(236,72,153,.18),transparent 72%),var(--bg)}header{padding:0 16px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.status{font-size:12px;padding:9px 10px}.head{margin:8px 0 12px}h1,h2,p{margin:0}h2{font-size:21px;line-height:1.18}.brand{font-size:22px}.brand b{color:#f0abfc}.card{padding:12px 14px;border:1px solid var(--line);border-radius:24px;background:var(--glass)}.strip{height:9px;border-radius:20px;margin-top:9px;background:repeating-linear-gradient(90deg,transparent 0 6px,#0a0918 7px 8px),linear-gradient(90deg,#ec4899,#a855f7,#22d3ee)}.sub{color:var(--muted);font-size:13px}.power{text-align:center;margin-top:14px;font-size:46px}.nav{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;border-top:1px solid var(--line);padding:12px;font-size:12px}.scrim{position:absolute;inset:0;background:rgba(5,4,14,.58)}.sheet{position:absolute;bottom:0;width:100%;max-height:100%;overflow:auto;padding:10px 16px 16px;display:grid;gap:10px;border-radius:24px 24px 0 0;border:1px solid var(--line);background:linear-gradient(180deg,#201840,#120e26);box-shadow:0 -20px 60px #0a0918}.grab{width:42px;height:4px;border-radius:10px;background:var(--muted);opacity:.5;justify-self:center}.center{text-align:center}.wheels{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);padding:8px;border-radius:24px;background:var(--glass);text-align:center}button{font:inherit;color:inherit;min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--glass2);border-radius:16px;padding:4px 8px;cursor:pointer}.wheel{display:grid;gap:4px}.wheel button{background:none;border-color:transparent;color:var(--muted);font-variant-numeric:tabular-nums}.wheel output{display:block;background:var(--glass2);border:1px solid #a855f7;border-radius:16px;padding:4px;font-weight:750;font-size:25px;font-variant-numeric:tabular-nums}.preview{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:9px 12px}.preview strong{font-variant-numeric:tabular-nums;font-size:18px}.close{font-size:21px}.switch{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 9px;border:1px solid var(--line);border-radius:16px;background:var(--glass);cursor:pointer}.switch input{appearance:none;-webkit-appearance:none;position:relative;width:46px;height:28px;margin:0;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.16);cursor:pointer}.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#f5f3ff;transition:left .15s}.switch input:checked{background:linear-gradient(135deg,#a855f7,#ec4899);border-color:transparent}.switch input:checked::after{left:21px}.switch{min-height:48px}.primary{background:linear-gradient(135deg,#7e22ce,#be185d);font-weight:700}:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><main class="phone"><div inert><header><div class="row status" aria-hidden="true"><span>22:45</span><span>▮▮▮ 100 %</span></div><div class="row head"><h1 class="brand"><b aria-hidden="true">∿</b> DeleLuz</h1><button aria-label="Temporizador de apagado">◴</button></div><div class="card"><div class="row"><strong>Sala</strong><span>● Conectado</span></div><p class="sub">LEDDMX-03-03C1</p><div class="strip"></div></div><div class="power">⏻</div></header></div><div class="nav" aria-hidden="true"><span>Inicio</span><span>Color</span><span>Escenas</span><span>Ajustes</span></div><div class="scrim"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="timer"><div class="grab" aria-hidden="true"></div><div class="row"><h2 id="timer">Temporizador de apagado</h2><button class="close" aria-label="Cerrar">×</button></div><p class="sub" id="memory">Última duración: 30 min</p><div class="wheels" aria-label="Duración"><div class="wheel" role="group" aria-label="Horas" data-wheel="0"><strong>Horas</strong><button aria-label="Restar una hora" data-delta="-1">23</button><output aria-label="Horas seleccionadas">00</output><button aria-label="Sumar una hora" data-delta="1">01</button></div><div class="wheel" role="group" aria-label="Minutos" data-wheel="1"><strong>Minutos</strong><button aria-label="Restar un minuto" data-delta="-1">29</button><output aria-label="Minutos seleccionados">30</output><button aria-label="Sumar un minuto" data-delta="1">31</button></div></div><p class="row preview" aria-live="polite"><span>Se apaga a las</span><strong id="end">23:15</strong></p><label class="switch">Apagado gradual <input type="checkbox"></label><p class="sub">Solo funciona con la app abierta.</p><button class="primary" id="start">Iniciar temporizador</button><p class="sub" role="status" id="result" hidden></p></section></main><script>const sheet=document.querySelector('.sheet'),home=document.querySelector('[inert]'),trigger=home.querySelector('button'),scrim=document.querySelector('.scrim'),close=document.querySelector('.close');function show(on){sheet.style.display=on?'grid':'none';scrim.hidden=!on;home.inert=on;(on?close:trigger).focus();}close.onclick=()=>show(false);trigger.onclick=()=>show(true);sheet.onkeydown=e=>{if(e.key==='Escape')show(false);};const values=[0,30],limits=[24,60],wheels=[...document.querySelectorAll('.wheel')],pad=n=>String(n).padStart(2,'0'),wrap=(n,i)=>(n+limits[i])%limits[i],start=document.querySelector('#start'),result=document.querySelector('#result');let saved=30;try{const stored=localStorage.getItem('deleluz-demo-timer');if(stored!==null&&/^\d+$/.test(stored)&&+stored>0&&+stored<1440)saved=+stored;}catch{}values[0]=Math.floor(saved/60);values[1]=saved%60;function render(){wheels.forEach((w,i)=>{w.querySelector('output').value=pad(values[i]);w.querySelectorAll('button').forEach(b=>b.textContent=pad(wrap(values[i]+Number(b.dataset.delta),i)));});const minutes=values[0]*60+values[1],end=(22*60+45+minutes)%1440;document.querySelector('#end').textContent=minutes?`${pad(Math.floor(end/60))}:${pad(end%60)}`:'—';start.disabled=!minutes;document.querySelector('#memory').textContent=`Última duración: ${Math.floor(saved/60)?Math.floor(saved/60)+' h ':''}${saved%60} min`;}wheels.forEach((w,i)=>w.querySelectorAll('button').forEach(b=>b.onclick=()=>{values[i]=wrap(values[i]+Number(b.dataset.delta),i);result.hidden=true;render();}));start.onclick=()=>{saved=values[0]*60+values[1];try{localStorage.setItem('deleluz-demo-timer',saved);}catch{}render();result.hidden=false;result.textContent='Vista de muestra: no se programa el apagado de la tira.';};render();</script></html>
