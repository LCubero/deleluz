<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bluetooth apagado · Aviso en Inicio</title><style>
:root{--bg:#0a0918;--ink:#f5f3ff;--muted:#bdb6dc;--faint:#8f88b3;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.11);--line:rgba(255,255,255,.14);--grad:linear-gradient(135deg,#a855f7,#ec4899);--warn:#fbbf24;--warn-bg:#251e2c;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.phone{max-width:480px;margin:auto;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:radial-gradient(320px 220px at 15% 0%,#a855f747,transparent 70%),radial-gradient(300px 350px at 100% 72%,#ec48992e,transparent 72%),var(--bg)}header,main{padding:0 16px}main{overflow:auto;padding-bottom:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.status{font-size:12px;padding:9px 10px}.head{margin:8px 0 12px}h1{font-size:24px;margin:0}h2,p{margin:0}h2{font-size:17px}.sub{color:var(--muted);font-size:13px}.accent,nav [aria-current] b{color:#f0abfc}nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;text-align:center;background:var(--bg);border-top:1px solid var(--line);padding:5px 8px 8px}nav button{display:grid;place-content:center;border-color:transparent;background:none;color:var(--muted);font-size:12px;padding:4px 0;min-width:0}nav b{font-size:19px}.card{border:1px solid var(--line);border-radius:24px;background:var(--glass);padding:12px 14px;margin:10px 0}button,input{font:inherit;color:inherit;min-height:44px;min-width:44px;border:1px solid var(--line);border-radius:16px;background:var(--glass2);padding:6px 10px}button:not(:disabled){cursor:pointer}.warning{margin-top:0;background:var(--warn-bg);border-color:var(--warn);padding:14px;display:grid;gap:10px}.message{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px}.icon{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--bg);color:var(--warn)}.icon svg{width:25px;height:25px}.warning h2{color:var(--warn)}.primary{background:linear-gradient(135deg,#7e22ce,#be185d);font-weight:700}.disabled{opacity:.55}.disabled :disabled{cursor:not-allowed}.strip{height:12px;border-radius:12px;background:repeating-linear-gradient(90deg,var(--glass2) 0 6px,transparent 6px 8px);margin:12px 0}.power{display:grid;justify-items:center;gap:6px;margin:12px auto}.power button{width:84px;height:84px;border-radius:50%;font-size:34px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.slider{width:100%;padding:0;accent-color:var(--muted)}.feedback{margin:8px 0}:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="phone"><header><div class="row status" aria-hidden="true"><span>11:39</span><span>▮▮▮ 100 %</span></div><div class="row head"><h1><span class="accent" aria-hidden="true">∿</span> DeleLuz</h1><button disabled aria-label="Temporizador">◴</button></div></header><main><section class="card warning" aria-labelledby="warning-title"><div class="message"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V3l4 4-2 2m-2 4v8l4-4-3-3m-7 3 3-3M3 3l18 18"/></svg></span><div><h2 id="warning-title">Bluetooth apagado</h2><p>Actívalo para conectar con la tira.</p></div></div><button class="primary" id="enable">Activar Bluetooth</button></section><p class="sub feedback" id="feedback" role="status" hidden></p><div class="disabled"><section class="card"><div class="row"><div><strong>Sala</strong><p class="sub">Controlador LED</p></div><span class="sub">Sin conexión</span></div><div class="strip"></div><button disabled>Reconectar</button> <button disabled>Cambiar</button></section><div class="power"><button disabled aria-label="Encendido no disponible">⏻</button><span>Control no disponible</span></div><section><h2>Acciones rápidas</h2><div class="grid"><button disabled>Blanco cálido</button><button disabled>＋ Agregar</button></div></section><section class="card"><label for="brightness"><strong>Brillo</strong></label><input class="slider" id="brightness" type="range" value="71" disabled></section></div></main><nav aria-label="Menú principal"><button aria-current="page"><b aria-hidden="true">⌂</b>Inicio</button><button><b aria-hidden="true">◎</b>Color</button><button><b aria-hidden="true">◇</b>Escenas</button><button><b aria-hidden="true">☷</b>Ajustes</button></nav></div><script>
const feedback=document.querySelector('#feedback');function show(text){feedback.hidden=false;feedback.textContent=text;}
document.querySelector('#enable').onclick=()=>show('Vista de muestra: en Android, este botón lleva a activar Bluetooth.');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.hasAttribute('aria-current')){feedback.hidden=true;return;}show(`${b.textContent.slice(1)} sigue disponible en la app. Esta muestra solo reproduce Inicio.`);});
</script></body></html>
