<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuenta regresiva en anillo · DeleLuz</title><style>
:root{--bg:#0a0918;--ink:#f5f3ff;--muted:#bdb6dc;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.11);--line:rgba(255,255,255,.14);--grad:linear-gradient(135deg,#a855f7,#ec4899);color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.phone{position:relative;isolation:isolate;max-width:480px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(320px 220px at 15% 0%,rgba(168,85,247,.28),transparent 70%),radial-gradient(300px 350px at 100% 72%,rgba(236,72,153,.18),transparent 72%),var(--bg)}header{padding:0 16px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.status{font-size:12px;padding:9px 10px}.head{margin:8px 0 12px}h1,h2,p{margin:0}h2{font-size:21px;line-height:1.18}h3{font-size:14px;margin:0}.brand{font-size:22px}.brand b{color:#f0abfc}.card{padding:12px 14px;border:1px solid var(--line);border-radius:24px;background:var(--glass)}.strip{height:9px;border-radius:20px;margin-top:9px;background:repeating-linear-gradient(90deg,transparent 0 6px,#0a0918 7px 8px),linear-gradient(90deg,#ec4899,#a855f7,#22d3ee)}.sub{color:var(--muted);font-size:13px}.power{text-align:center;margin-top:14px;font-size:42px}.nav{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;border-top:1px solid var(--line);padding:12px;font-size:12px}.scrim{position:absolute;inset:0;background:rgba(5,4,14,.58)}.sheet{position:absolute;bottom:0;width:100%;max-height:100%;overflow:auto;padding:10px 16px 16px;display:grid;gap:8px;border-radius:24px 24px 0 0;border:1px solid var(--line);background:linear-gradient(180deg,#201840,#120e26);box-shadow:0 -20px 60px #0a0918}.grab{width:42px;height:4px;border-radius:10px;background:var(--muted);opacity:.5;justify-self:center}.ring{width:clamp(106px,28vw,130px);aspect-ratio:1;margin:0 auto;padding:7px;border-radius:50%;background:conic-gradient(#a855f7,#ec4899 79%,rgba(255,255,255,.14) 79%);display:grid;place-items:stretch}.ring div{border-radius:50%;display:grid;place-content:center;text-align:center;background:#1b1436}.ring strong{font-size:26px;font-variant-numeric:tabular-nums}.center{text-align:center}.controls,.presets{display:grid;gap:5px}.controls{grid-template-columns:repeat(3,1fr)}.presets{grid-template-columns:repeat(4,1fr)}.presets button:last-child{grid-column:1/-1}button,input[type=number]{font:inherit;color:inherit;min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--glass2);border-radius:16px;padding:4px 6px;cursor:pointer}button[aria-pressed=true]{border-color:#f0abfc}.close{font-size:21px}.switch{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 9px;border:1px solid var(--line);border-radius:16px;background:var(--glass);cursor:pointer}.switch input{appearance:none;-webkit-appearance:none;position:relative;width:46px;height:28px;margin:0;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.16);cursor:pointer}.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#f5f3ff;transition:left .15s}.switch input:checked{background:linear-gradient(135deg,#a855f7,#ec4899);border-color:transparent}.switch input:checked::after{left:21px}.switch{min-height:48px}.custom:not([hidden]){display:flex;gap:6px}.custom input{width:100%}.note{margin:0}:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sheet [hidden]{display:none}.custom:not([hidden]){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.custom label{display:grid;gap:4px}.custom button,.custom p{grid-column:1/-1}.custom input{cursor:text}.primary{background:linear-gradient(135deg,#7e22ce,#be185d);font-weight:700}.error{color:var(--ink);font-weight:650}.switch:focus-within{outline:3px solid #22d3ee;outline-offset:2px}.switch input:focus-visible{outline:none}
</style><main class="phone"><div inert><header><div class="row status" aria-hidden="true"><span>22:51</span><span>▮▮▮ 100 %</span></div><div class="row head"><h1 class="brand"><b aria-hidden="true">∿</b> DeleLuz</h1><button aria-label="Temporizador de apagado">◴</button></div><div class="card"><div class="row"><strong>Sala</strong><span>● Conectado</span></div><p class="sub">LEDDMX-03-03C1</p><div class="strip"></div></div><div class="power">⏻</div></header></div><div class="nav" aria-hidden="true"><span>Inicio</span><span>Color</span><span>Escenas</span><span>Ajustes</span></div><div class="scrim"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="timer"><div class="grab" aria-hidden="true"></div><div class="row"><h2 id="timer">Temporizador de apagado</h2><button class="close" aria-label="Cerrar">×</button></div><div class="ring"><div><strong id="left">23:41</strong><span class="sub">restantes</span></div></div><p id="end" class="center" role="status">Se apaga a las <strong>23:15</strong></p><div class="controls"><button data-add="5">+5 min</button><button data-add="15">+15 min</button><button id="cancel">Cancelar</button></div><h3>Duración</h3><div class="presets" aria-label="Duraciones predefinidas"><button data-min="15" aria-pressed="false">15 min</button><button data-min="30" aria-pressed="true">30 min</button><button data-min="60" aria-pressed="false">1 h</button><button data-min="120" aria-pressed="false">2 h</button><button id="custom" aria-expanded="false" aria-controls="custom-fields">Personalizado</button></div><form id="custom-fields" class="custom" hidden novalidate><label>Minutos<input id="minutes" type="number" min="0" max="720" step="1" value="30" required aria-describedby="timer-error"></label><label>Segundos<input id="seconds" type="number" min="0" max="59" step="1" value="0" required aria-describedby="timer-error"></label><p id="timer-error" class="sub error" role="alert" hidden>Introduce minutos (0–720) y segundos (0–59) enteros. El mínimo es 1 segundo.</p><button id="apply-time">Aplicar</button></form><button id="start" class="primary" hidden>Iniciar temporizador</button><label class="switch">Apagado gradual <input type="checkbox"></label><p class="sub note">Solo funciona con la app abierta.</p></section></main><script>const sheet=document.querySelector('.sheet'),home=document.querySelector('[inert]'),trigger=home.querySelector('button'),scrim=document.querySelector('.scrim'),close=document.querySelector('.close');function show(on){sheet.style.display=on?'grid':'none';scrim.hidden=!on;home.inert=on;(on?close:trigger).focus();}close.onclick=()=>show(false);trigger.onclick=()=>show(true);sheet.onkeydown=e=>{if(e.key==='Escape')show(false);};
const $=selector=>document.querySelector(selector),left=$('#left'),end=$('#end'),ring=$('.ring');
const presets=[...document.querySelectorAll('[data-min]')],custom=$('#custom'),fields=$('#custom-fields');
const minutes=$('#minutes'),seconds=$('#seconds'),error=$('#timer-error'),start=$('#start'),apply=$('#apply-time');
let remaining=1421,duration=1800,chosen=presets[1];
const pad=n=>String(n).padStart(2,'0');
function draw(){
  const active=remaining>0;
  ring.hidden=$('.controls').hidden=!active;start.hidden=active;apply.hidden=apply.disabled=!active;
  left.textContent=`${Math.floor(remaining/60)}:${pad(remaining%60)}`;
  const m=(22*60+51+Math.ceil(remaining/60))%1440;
  end.textContent=active?`Se apaga a las ${pad(Math.floor(m/60))}:${pad(m%60)}`:'No hay un temporizador activo.';
  presets.forEach(b=>b.setAttribute('aria-pressed',String(b===chosen&&fields.hidden)));
}
function clearError(){error.hidden=true;[minutes,seconds].forEach(input=>input.removeAttribute('aria-invalid'));}
function expand(on){fields.hidden=!on;custom.setAttribute('aria-expanded',String(on));clearError();}
function customDuration(){
  const total=60*minutes.valueAsNumber+seconds.valueAsNumber;
  if(!minutes.validity.valid||!seconds.validity.valid||!(total>=1)){
    const invalid=[minutes,seconds].filter(input=>!input.validity.valid||total===0);
    error.hidden=false;invalid.forEach(input=>input.setAttribute('aria-invalid','true'));invalid[0]?.focus();return null;
  }
  clearError();return total;
}
fields.oninput=clearError;
custom.onclick=()=>{expand(fields.hidden);draw();if(!fields.hidden)minutes.focus();};
presets.forEach(button=>button.onclick=()=>{
  chosen=button;duration=60*Number(button.dataset.min);expand(false);if(remaining)remaining=duration;draw();
});
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{remaining+=60*Number(b.dataset.add);draw();});
$('#cancel').onclick=()=>{remaining=0;if(!chosen)expand(true);draw();start.focus();};
function startTimer(){
  const value=fields.hidden?duration:customDuration();if(value===null)return;
  if(!fields.hidden)chosen=null;
  remaining=duration=value;expand(false);draw();$('.controls button').focus();
}
start.onclick=startTimer;
fields.onsubmit=e=>{e.preventDefault();startTimer();};</script></html>
