<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anillo y saturación · DeleLuz</title>
<style>
:root{--bg:#0a0918;--ink:#f5f3ff;--muted:#bdb6dc;--faint:#8f88b3;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.11);--line:rgba(255,255,255,.14);--violet:#a855f7;--magenta:#ec4899;--cyan:#22d3ee;--ok:#4ade80;--grad:linear-gradient(135deg,#a855f7,#ec4899);color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.phone{max-width:480px;margin:auto;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:radial-gradient(320px 220px at 15% 0%,rgba(168,85,247,.28),transparent 70%),radial-gradient(300px 350px at 100% 72%,rgba(236,72,153,.18),transparent 72%),var(--bg)}header,main{padding:0 16px}main{overflow:auto;padding-bottom:16px}.status,.head,.line{display:flex;align-items:center;justify-content:space-between;gap:8px}.status{font-size:12px;padding:9px 10px}.head{margin:8px 0 12px}h1{font-size:24px;margin:0}h2,p{margin:0}h2{font-size:15px}.badge{background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-weight:650;font-size:13px}.badge::before{content:'';display:inline-block;background:var(--ok);width:8px;height:8px;border-radius:50%;margin-right:7px;box-shadow:0 0 10px var(--ok)}.seg,nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;text-align:center}.seg{background:var(--glass);border:1px solid var(--line);padding:3px;border-radius:16px}.seg span,nav span{display:grid;place-content:center;min-height:44px;color:var(--muted);font-weight:650;border-radius:12px;font-size:14px}.seg [aria-current]{background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}nav{background:var(--bg);border-top:1px solid var(--line);padding:5px 8px 8px}nav span{font-size:12px;color:var(--faint)}nav b{font-size:19px}nav [aria-current]{color:var(--ink)}nav [aria-current] b{color:#f0abfc;text-shadow:0 0 8px var(--magenta)}.card{border:1px solid var(--line);border-radius:24px;background:var(--glass);padding:12px 14px;margin-top:10px}.wheel{width:clamp(158px,57vw,224px);aspect-ratio:1;position:relative;border-radius:50%;margin:14px auto 10px;background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red);box-shadow:0 0 38px rgba(168,85,247,.25);display:grid;place-items:center}.wheel::before{content:'';position:absolute;inset:20%;border-radius:50%;background:#100d22}.wheel::after{content:'';position:absolute;inset:31%;border-radius:50%;background:var(--sample,#ffc87f);box-shadow:0 0 22px var(--sample,#ffc87f)}.marker{position:absolute;z-index:1;width:25px;height:25px;border:3px solid white;border-radius:50%;background:var(--sample,#ffc87f);top:11%;left:70%;box-shadow:0 2px 8px #0a0918}.device{text-align:center;color:var(--muted);font-size:13px}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}button{font:inherit;color:inherit;background:var(--glass2);border:1px solid var(--line);min-height:44px;min-width:44px;border-radius:16px;cursor:pointer}button[aria-pressed=true]{border-color:var(--violet);box-shadow:inset 0 0 0 1px var(--violet)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tone);margin-right:4px}input[type=range]{appearance:none;width:100%;height:44px;margin:0;background:transparent;cursor:pointer}input[type=range]::-webkit-slider-runnable-track{height:9px;border-radius:20px;background:var(--track,var(--grad))}input[type=range]::-webkit-slider-thumb{appearance:none;width:23px;height:23px;margin-top:-7px;background:white;border-radius:50%;box-shadow:0 0 0 4px #5c3488}:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}output{font-variant-numeric:tabular-nums}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="phone"><header><div class="status" aria-hidden="true"><span>11:39</span><span>▮▮▮ 100 %</span></div><div class="head"><h1>Color</h1><span class="badge">Conectado</span></div><div class="seg" aria-label="Modo"><span aria-current="true">Color fijo</span><span>Efectos integrados</span></div></header><main><div class="wheel" role="img" aria-label="Anillo de tono con muestra del color elegido"><i class="marker"></i></div><p class="device">Sala · LEDDMX-03-03C1</p><section class="card" aria-labelledby="sat-title"><div class="line"><h2 id="sat-title">Saturación</h2><output for="sat">50 %</output></div><input id="sat" type="range" value="50" aria-labelledby="sat-title" style="--track:linear-gradient(90deg,white,#ff9000)"></section><section class="card"><h2>Blancos</h2><div class="chips"><button aria-pressed="false" style="--tone:#ffe0ba"><i class="dot"></i>Cálido</button><button aria-pressed="false" style="--tone:#fff"><i class="dot"></i>Neutro</button><button aria-pressed="false" style="--tone:#d9e8ff"><i class="dot"></i>Frío</button></div></section><section class="card"><label class="line" for="bright"><strong>Brillo</strong><output for="bright">71 %</output></label><input id="bright" type="range" value="71"></section></main><nav aria-label="Menú principal"><span><b aria-hidden="true">⌂</b>Inicio</span><span aria-current="page"><b aria-hidden="true">◎</b>Color</span><span><b aria-hidden="true">◇</b>Escenas</span><span><b aria-hidden="true">☷</b>Ajustes</span></nav></div>
<script>
const wheel=document.querySelector('.wheel'), chips=[...document.querySelectorAll('.chips button')];document.querySelectorAll('input').forEach(input=>input.addEventListener('input',()=>{input.previousElementSibling.querySelector('output').value=input.value+' %';if(input.id==='sat'){chips.forEach(b=>b.setAttribute('aria-pressed','false'));wheel.style.setProperty('--sample',`hsl(34 100% ${100-input.value/2}%)`);}}));chips.forEach(b=>b.onclick=()=>{chips.forEach(c=>c.setAttribute('aria-pressed',String(c===b)));wheel.style.setProperty('--sample',b.style.getPropertyValue('--tone'));});
</script></html>
